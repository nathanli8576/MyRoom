<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burn It</title>
<style>
:root{--bg:#120e0a;--ink:#f0e2d4;--mute:#b09880;--line:rgba(255,255,255,.12);--accent:240,150,80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(60% 40% at 50% 110%,rgba(240,120,50,.20),transparent 70%),
    radial-gradient(50% 40% at 50% -10%,rgba(120,60,20,.16),transparent 70%),
    var(--bg);
  color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  -webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.back,.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:3;
  width:40px;height:40px;display:grid;place-items:center;border-radius:999px;
  color:var(--mute);text-decoration:none;border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px -18px rgba(0,0,0,.9);
  transition:color .2s cubic-bezier(.2,.7,.3,1),border-color .2s cubic-bezier(.2,.7,.3,1),
             background .2s cubic-bezier(.2,.7,.3,1),transform .2s cubic-bezier(.2,.7,.3,1),
             box-shadow .2s cubic-bezier(.2,.7,.3,1)}
.back{left:14px}
.mute{right:14px;padding:0;margin:0;min-width:0;cursor:pointer}
.back:hover,.mute:hover{color:var(--ink);border-color:rgba(var(--accent),.55);
  background:rgba(var(--accent),.1);transform:translateY(-1px);
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 14px 26px -18px rgba(0,0,0,.9)}
.back:active,.mute:active{transform:scale(.96)}
.mute svg{width:16px;height:16px}
.mute .m{display:block}
.mute .x{display:none}
.mute.off .m{display:none}
.mute.off .x{display:block}
.ui{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px}
h1{margin:0 0 6px;font-weight:300;font-size:clamp(24px,4vw,32px);letter-spacing:.14em}
.sub{margin:0 0 26px;color:var(--mute);font-style:italic;font-size:14px;letter-spacing:.02em}
.slot{width:min(520px,100%);position:relative;display:grid}
.slot>*{grid-area:1/1}
.card{transition:opacity .8s ease;position:relative;z-index:1}
.card.gone{opacity:0;pointer-events:none}
textarea{width:100%;height:clamp(130px,22vh,180px);padding:16px 18px;resize:none;
  background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;
  color:var(--ink);font:300 18px/1.6 inherit;cursor:text;
  outline:2px solid transparent;outline-offset:3px;
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 22px 46px -34px rgba(0,0,0,.95);
  transition:border-color .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s cubic-bezier(.2,.7,.3,1),
             background .3s cubic-bezier(.2,.7,.3,1)}
textarea::placeholder{color:#8a7860}
textarea:focus{border-color:rgba(var(--accent),.5);background:rgba(255,255,255,.05);
  box-shadow:0 0 0 4px rgba(var(--accent),.07),0 0 40px rgba(var(--accent),.12),
             0 22px 46px -34px rgba(0,0,0,.95)}
textarea:focus-visible{outline-color:rgba(var(--accent),.9)}
button{display:block;margin:18px auto 0;height:40px;padding:0 30px;border-radius:999px;
  font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#ffd9b0;cursor:pointer;
  white-space:nowrap;border:1px solid rgba(var(--accent),.45);
  background:linear-gradient(rgba(var(--accent),.18),rgba(var(--accent),.06));
  transition:box-shadow .2s cubic-bezier(.2,.7,.3,1),border-color .2s cubic-bezier(.2,.7,.3,1),
             background .2s cubic-bezier(.2,.7,.3,1),color .2s cubic-bezier(.2,.7,.3,1),
             transform .18s cubic-bezier(.2,.7,.3,1),opacity .3s;
  min-width:140px}
button:hover:not(:disabled){box-shadow:0 0 28px rgba(var(--accent),.35);border-color:rgba(var(--accent),.75);
  background:linear-gradient(rgba(var(--accent),.26),rgba(var(--accent),.09));
  transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
/* primary Burn button — warm ember gradient + glow */
#go{background:linear-gradient(180deg,rgba(var(--accent),.40),rgba(var(--accent),.14));
  box-shadow:0 12px 28px -16px rgba(var(--accent),.75),0 0 22px rgba(var(--accent),.16),
             inset 0 1px 0 rgba(255,255,255,.14)}
#go:hover:not(:disabled){background:linear-gradient(180deg,rgba(var(--accent),.52),rgba(var(--accent),.20));
  box-shadow:0 16px 34px -16px rgba(var(--accent),.85),0 0 34px rgba(var(--accent),.40),
             inset 0 1px 0 rgba(255,255,255,.2)}
.after{opacity:0;pointer-events:none;
  transition:opacity 1.1s ease .3s,transform .6s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 38px;border:1px solid var(--line);border-radius:20px;
  background:rgba(255,255,255,.035);
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 26px 54px -36px rgba(0,0,0,.95);
  transform:translateY(8px)}
.after.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.after p{margin:0 0 4px;color:var(--mute);font-style:italic;font-size:15px;line-height:1.5}
.after button{margin-top:22px}
.status{margin:22px 0 0;text-align:center;color:var(--mute);font-style:italic;font-size:15px;
  line-height:1.5;min-height:1.5em;grid-column:1;pointer-events:none;user-select:none;
  padding:6px 16px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,255,255,.035);
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -22px rgba(0,0,0,.9)}
.status:empty{border-color:transparent;background:transparent;box-shadow:none}
/* one consistent, visible focus ring for every focusable */
a:focus-visible,button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid rgba(var(--accent),.9);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<a class="back" href="index.html" aria-label="Back to the shelf"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
<button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false" title="Mute sound">
  <svg class="m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
  <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>
<main class="ui">
  <h1>Burn It</h1>
  <p class="sub">Write it. Then let it burn.</p>
  <div class="slot">
    <div class="card" id="card">
      <textarea id="thought" maxlength="280" placeholder="What do you want to burn?" aria-label="What you want to burn"></textarea>
      <button id="go" disabled>Burn</button>
    </div>
    <div class="after" id="after" inert>
      <p>Gone.</p>
      <button id="again">Burn another</button>
    </div>
    <p class="status" id="status" aria-live="polite" tabindex="-1"></p>
  </div>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#c'), ctx = cv.getContext('2d');
  const ta = $('#thought'), go = $('#go'), card = $('#card'),
        after = $('#after'), again = $('#again'), status = $('#status'),
        muteBtn = $('#mute');

  /* reduced motion — kept live so an OS-level toggle is honored mid-session */
  const calmMQ = matchMedia('(prefers-reduced-motion: reduce)');
  let calm = calmMQ.matches;
  const onCalmChange = e => { calm = e.matches; };
  if (calmMQ.addEventListener) calmMQ.addEventListener('change', onCalmChange);
  else if (calmMQ.addListener) calmMQ.addListener(onCalmChange);

  /* ---------- mute: remembered; no AudioContext is ever created at load ---------- */
  const MUTE_KEY = 'burn:muted';
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch(e){}
  const paintMute = () => {
    muteBtn.classList.toggle('off', muted);
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('title', muted ? 'Unmute sound' : 'Mute sound');
  };
  paintMute();
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch(e){}
    paintMute();
    if (AC && master){
      try { master.gain.setTargetAtTime(muted ? 0 : .4, AC.currentTime, .05); } catch(e){}
    }
  });

  /* render loop — parked whenever the room is fully at rest */
  let rafId = 0, last = performance.now();

  let W=0,H=0,dpr=1;
  function resize(){
    dpr = Math.min(devicePixelRatio||1,2);
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    scheduleFrame(); // canvas was just wiped — repaint the resting frame once
  }
  addEventListener('resize', resize); resize();

  card.addEventListener('pointerdown', e => {
    if (ta.disabled) return;
    if (e.target === card) ta.focus({ preventScroll: true });
  });

  /* ---------- audio: gesture-gated, minimal ---------- */
  let AC=null, master=null;
  let burnOsc=null, burnOscGain=null, burnLfo=null, noiseSrc=null, noiseGain=null, noiseFilter=null;
  function ensureAudio(){
    if (!AC){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      try { AC = new Ctx(); } catch(e){ return false; }
      master = AC.createGain(); master.gain.value = muted ? 0 : .4; master.connect(AC.destination);
    }
    if (AC.state !== 'running') AC.resume().catch(()=>{});
    return true;
  }
  function startBurnAudio(){
    if (!ensureAudio() || muted) return;
    const t = AC.currentTime;
    burnOsc = AC.createOscillator(); burnOsc.type = 'sawtooth'; burnOsc.frequency.value = 42;
    burnLfo = AC.createOscillator(); burnLfo.type = 'sine'; burnLfo.frequency.value = 5.2;
    const lg = AC.createGain(); lg.gain.value = 3.5; burnLfo.connect(lg); lg.connect(burnOsc.frequency);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160; lp.Q.value = 1.2;
    burnOscGain = AC.createGain();
    burnOscGain.gain.setValueAtTime(0, t);
    burnOscGain.gain.linearRampToValueAtTime(.09, t + .4);
    burnOsc.connect(lp); lp.connect(burnOscGain); burnOscGain.connect(master);
    burnOsc.start(t); burnLfo.start(t);

    const nb = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = nb.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    noiseSrc = AC.createBufferSource(); noiseSrc.buffer = nb; noiseSrc.loop = true;
    noiseFilter = AC.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 800; noiseFilter.Q.value = .6;
    noiseGain = AC.createGain();
    noiseGain.gain.setValueAtTime(0, t);
    noiseGain.gain.linearRampToValueAtTime(.035, t + .5);
    noiseSrc.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(master);
    noiseSrc.start(t);
  }
  function updateBurnAudio(intensity){
    if (!AC || muted || !burnOscGain) return;
    const t = AC.currentTime;
    burnOscGain.gain.setTargetAtTime(.06 + intensity*.14, t, .15);
    noiseGain.gain.setTargetAtTime(.02 + intensity*.07, t, .15);
    noiseFilter.frequency.setTargetAtTime(600 + intensity*1800, t, .15);
  }
  function stopBurnAudio(){
    if (!AC) return;   // cleanup deliberately runs while muted, so nodes still get stopped
    const t = AC.currentTime;
    if (burnOscGain) burnOscGain.gain.setTargetAtTime(0, t, .3);
    if (noiseGain)   noiseGain.gain.setTargetAtTime(0, t, .3);
    const o = burnOsc, l = burnLfo, n = noiseSrc;
    burnOsc = null; burnLfo = null; noiseSrc = null; burnOscGain = null; noiseGain = null;
    setTimeout(() => { try { o&&o.stop(); l&&l.stop(); n&&n.stop(); } catch(e){} }, 1200);
  }
  function playBoom(){
    if (!ensureAudio() || muted) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(30, t + 1.1);
    const g = AC.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.55, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + 1.7);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.9);
    const nb = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = nb.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2);
    const ns = AC.createBufferSource(); ns.buffer = nb;
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const ng = AC.createGain(); ng.gain.value = .18;
    ns.connect(lp); lp.connect(ng); ng.connect(master);
    ns.start(t);
  }

  /* ---------- text sampling ---------- */
  function sampleText(){
    const cs = getComputedStyle(ta);
    const fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight)||fs*1.6;
    const pl = parseFloat(cs.paddingLeft), pt = parseFloat(cs.paddingTop);
    const w = ta.clientWidth, h = ta.clientHeight, mw = w - pl - parseFloat(cs.paddingRight);
    const o = document.createElement('canvas'); o.width=w; o.height=h;
    const c = o.getContext('2d',{willReadFrequently:true});
    c.font = `${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
    c.textBaseline='middle'; c.fillStyle='#fff';
    const lines = [];
    for (const para of ta.value.split('\n')) {
      let cur = '';
      for (const word of para.split(' ')) {
        const t = cur ? cur+' '+word : word;
        if (c.measureText(t).width <= mw) cur = t;
        else { if (cur) lines.push(cur); cur = word; }
      }
      lines.push(cur);
    }
    lines.forEach((ln,i)=>c.fillText(ln, pl, pt + (i+.5)*lh - ta.scrollTop));
    const d = c.getImageData(0,0,w,h).data;
    const r = ta.getBoundingClientRect();
    const pts = [];
    for (let y=0;y<h;y+=3) for (let x=0;x<w;x+=3)
      if (d[(y*w+x)*4+3] > 110)
        pts.push({ x: r.left + ta.clientLeft + x, y: r.top + ta.clientTop + y });
    return pts;
  }

  /* ---------- state ---------- */
  const MAX_PARTS = 1000;
  let parts=[], embers=[], smoke=[], whirl=[], waves=[], coal=null;
  let phase='idle';
  let frontY=0, startY=0, t0=0;
  let vortexX=0, vortexY=0, vortexR=0;
  let totalParticles=0, absorbed=0;
  let shake=0, warm=0, timeScale=1;

  /* persistent whirl pool of orbiting sparks — the "wind" of the fire storm */
  const WHIRL_N = calm ? 16 : 54;
  for (let i = 0; i < WHIRL_N; i++){
    whirl.push({
      angle: Math.random()*6.28,
      radius: 80 + Math.random()*260,
      speed: .022 + Math.random()*.04,
      drift: .5 + Math.random()*1.1,
      size: .8 + Math.random()*1.4,
      seed: Math.random()*6.28,
      x: 0, y: 0, px: 0, py: 0
    });
  }

  function burn(){
    const text = ta.value.trim();
    if (!text || phase !== 'idle') return;
    let pts = sampleText();
    if (!pts.length) return;
    if (pts.length > MAX_PARTS){
      for (let i = pts.length-1; i > 0; i--){
        const j = (Math.random()*(i+1))|0;
        [pts[i], pts[j]] = [pts[j], pts[i]];
      }
      pts = pts.slice(0, MAX_PARTS);
    }

    let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
    for (const p of pts){
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }

    /* the whirl anchors above the text, scaled to the viewport so it feels
       like a storm front opening up rather than a pocket whirl */
    vortexX = (minX + maxX) / 2;
    vortexY = Math.max(140, H * .40);
    vortexR = Math.min(W, H) * .42;

    parts = pts.map(p => ({
      x:p.x, y:p.y, vx:0, vy:0, life:1, heat:0,
      seed: Math.random()*6.28,
      size: .9 + Math.random()*1.1,
      burn: Math.sin(p.x*.09 + p.y*.03)*9 + Math.sin(p.y*.11)*6,
      lit: false
    }));

    startY = maxY + 30;
    frontY = startY;
    totalParticles = parts.length;
    absorbed = 0;
    coal = null;
    embers.length = 0; smoke.length = 0; waves.length = 0;
    t0 = performance.now();
    phase = 'burning';
    if (!calm) shake = 6;
    warm = .15;
    timeScale = 1;

    /* park focus outside the card BEFORE it becomes inert, so the Burn
       button (or textarea) never silently drops focus to <body> */
    const parked = document.activeElement;
    if (parked && card.contains(parked)) status.focus({ preventScroll: true });
    card.classList.add('gone'); card.inert = true;
    after.classList.remove('show'); after.inert = true;
    ta.disabled = go.disabled = true;
    status.textContent = 'Burning…';
    startBurnAudio();
    scheduleFrame();

    /* initial upward burst — a rising ring of sparks at the bottom */
    for (let i = 0; i < 70; i++){
      const a = -Math.PI/2 + (Math.random()-.5) * 2.2;
      const sp = 4 + Math.random()*6;
      embers.push({
        x: vortexX + (Math.random()-.5)*(maxX-minX+80),
        y: maxY + 10,
        vx: Math.cos(a) * sp * .5,
        vy: Math.sin(a) * sp,
        life: 1, seed: Math.random()*6.28
      });
    }
  }

  function spawnWave(x, y, maxR){
    waves.push({ x, y, r: 6, maxR, life: 1 });
  }

  function update(dtReal){
    if (phase === 'idle') return;

    /* slow-mo when the coal is collapsing */
    if (coal && coal.state === 'contract' && performance.now() - coal.stateT > 400) timeScale = .32;
    else timeScale = 1;
    const dt = dtReal * timeScale;

    // decay ambient effects on real time so slow-mo doesn't freeze the world
    shake *= Math.pow(.90, dtReal);
    if (phase !== 'burning') warm *= Math.pow(.965, dtReal);

    // embers
    for (let i = embers.length - 1; i >= 0; i--){
      const e = embers[i]; e.life -= dtReal * .010;
      if (e.life <= 0){ embers.splice(i,1); continue; }
      e.vy -= .002 * dt;
      e.vx *= .978; e.vy *= .978;
      e.x += e.vx * dt; e.y += e.vy * dt;
    }
    // smoke
    for (let i = smoke.length - 1; i >= 0; i--){
      const s = smoke[i]; s.life -= dtReal * .005;
      if (s.life <= 0){ smoke.splice(i,1); continue; }
      s.vx *= .99; s.vy *= .99; s.r += .45 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
    }
    // shockwaves
    for (let i = waves.length - 1; i >= 0; i--){
      const w = waves[i];
      w.r += (w.maxR - w.r) * .07 * dtReal;
      w.life -= dtReal * .012;
      if (w.life <= 0){ waves.splice(i,1); continue; }
    }

    /* whirl sparks orbit continuously once burn begins */
    if (phase === 'burning' || coal){
      const elapsed = (performance.now() - t0) / 1000;
      const ramp = Math.max(0, Math.min(1, (elapsed - .35) / 1.0));
      for (const s of whirl){
        s.px = s.x; s.py = s.y;
        s.angle += s.speed * dt * (.4 + ramp);
        s.radius -= s.drift * dt * ramp;
        if (s.radius < 18) s.radius = vortexR * (.6 + Math.random()*.7);
        const wob = Math.sin(performance.now()*.0025 + s.seed) * 4;
        s.x = vortexX + Math.cos(s.angle) * s.radius;
        s.y = vortexY + Math.sin(s.angle) * s.radius + wob;
      }
    }

    if (phase === 'burning'){
      const elapsed = (performance.now() - t0) / 1000;
      /* reduced motion: the sweep still runs (it IS the interaction) but
         resolves a little sooner so the on-screen motion is shorter */
      frontY = startY - (calm ? 340 : 280) * elapsed;
      const ramp = Math.max(0, Math.min(1, (elapsed - .35) / 1.0));

      updateBurnAudio(ramp * (1 - parts.length / totalParticles) + ramp * .4);
      warm = Math.max(warm, .18 + .35 * ramp);
      if (!calm && ramp > .1 && ramp < .95) shake = Math.max(shake, 2 + ramp * 4);

      // sparks shed off the whirl edge
      if (ramp > .3 && Math.random() < 1.2 * dt){
        const a = Math.random()*6.28;
        const r = vortexR * (.3 + Math.random()*.6);
        embers.push({
          x: vortexX + Math.cos(a)*r,
          y: vortexY + Math.sin(a)*r,
          vx: Math.cos(a + 1.5) * 1.4,
          vy: Math.sin(a + 1.5) * 1.4 - .5,
          life: 1, seed: Math.random()*6.28
        });
      }

      for (let i = parts.length - 1; i >= 0; i--){
        const p = parts[i];
        if (p.y + p.burn < frontY) continue;

        if (!p.lit){
          p.lit = true; p.heat = 1;
          p.vx = (Math.random()-.5) * .8;
          p.vy = -.7 - Math.random() * .9;
          // chain-reaction sparks
          for (let j = 0; j < 2; j++){
            const a = -Math.PI/2 + (Math.random()-.5)*2.4;
            const sp = 1.5 + Math.random()*2.5;
            embers.push({
              x: p.x, y: p.y,
              vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
              life: 1, seed: Math.random()*6.28
            });
          }
        }

        p.life -= dt * .008;
        p.heat -= dt * .042;
        if (p.life <= 0){ parts.splice(i,1); continue; }

        // intrinsic rise
        p.vy -= .05 * dt;
        p.vx += Math.sin(elapsed * 2.4 + p.seed) * .014 * dt;

        /* ---- VORTEX PHYSICS ----
           three-zone behavior:
             far  → gentle pull inward
             mid  → strong tangential (visible orbit)
             near → hard inward suction spiraling to center            */
        if (ramp > .02){
          const dx = vortexX - p.x, dy = vortexY - p.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          const ang = Math.atan2(dy, dx);
          let inward, tangent;
          const orbitR = vortexR * .38;
          if (dist > orbitR * 2.2)      { inward = .55; tangent = .35; }
          else if (dist > orbitR * .65) { inward = .18; tangent = 1.6; }
          else                          { inward = 2.0; tangent = 2.4; }
          const iux = Math.cos(ang), iuy = Math.sin(ang);
          const tgx = -Math.sin(ang), tgy = Math.cos(ang);
          const tvx = iux * inward + tgx * tangent;
          const tvy = iuy * inward + tgy * tangent;
          const k = .085;
          p.vx += (tvx - p.vx) * k * dt * ramp;
          p.vy += (tvy - p.vy) * k * dt * ramp;
        }

        p.vx *= .982; p.vy *= .982;
        p.x += p.vx * dt; p.y += p.vy * dt;

        // absorbed
        const dcx = vortexX - p.x, dcy = vortexY - p.y;
        if (Math.sqrt(dcx*dcx + dcy*dcy) < 10 && ramp > .35){
          absorbed++;
          if (!calm) shake = Math.min(20, shake + .12);
          for (let j = 0; j < 3; j++){
            const a = Math.random()*6.28;
            embers.push({
              x: vortexX + Math.cos(a)*4, y: vortexY + Math.sin(a)*4,
              vx: Math.cos(a) * (1 + Math.random()*1.2),
              vy: Math.sin(a) * (1 + Math.random()*1.2) - .4,
              life: 1, seed: Math.random()*6.28
            });
          }
          parts.splice(i, 1);
          continue;
        }

        if (smoke.length < 160 && Math.random() < .002 * dt)
          smoke.push({ x:p.x, y:p.y, vx:(Math.random()-.5)*.22, vy:-.35-Math.random()*.35,
                       life:1, r:6+Math.random()*8 });
      }

      if (!coal && parts.length === 0 && ramp > .55){
        coal = { state: 'forming', stateT: performance.now(), x: vortexX, y: vortexY };
        if (!calm) shake = Math.max(shake, 8);
      }
    }

    /* ---------- coal state machine ---------- */
    if (coal){
      const t = (performance.now() - coal.stateT) / 1000;
      if (coal.state === 'forming' && t > .35){
        coal.state = 'flare'; coal.stateT = performance.now();
        if (!calm){
          shake = Math.max(shake, 26);
          spawnWave(vortexX, vortexY, Math.max(W, H) * .55);
        }
        warm = 1;
        playBoom();
      } else if (coal.state === 'flare' && t > .55){
        coal.state = 'contract'; coal.stateT = performance.now();
        stopBurnAudio();
      } else if (coal.state === 'contract' && t > 1.6){
        coal = null;   // extinguished: the whirl ends here so the loop can wind down
        phase = 'done';
        status.textContent = '';
        after.inert = false;
        after.classList.add('show');
        /* hand focus to "Burn another" — but only if it was parked on the status
           line; never steal focus from the back/mute buttons mid-use */
        const ae = document.activeElement;
        if (!ae || ae === document.documentElement || ae === document.body || ae === status)
          again.focus({ preventScroll: true });
        for (let i = 0; i < 90; i++){
          const a = Math.random()*6.28;
          const sp = 2 + Math.random()*7;
          embers.push({
            x: vortexX, y: vortexY,
            vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
            life: 1, seed: Math.random()*6.28
          });
        }
      }
    }
  }

  function draw(ts){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);

    // screen shake — never applied under reduced motion
    if (!calm && shake > .3){
      ctx.translate((Math.random()-.5) * shake, (Math.random()-.5) * shake);
    }

    // base warm gradient at bottom
    const g0 = ctx.createRadialGradient(W/2, H+20, 0, W/2, H+20, 260);
    g0.addColorStop(0,'rgba(240,140,60,.20)');
    g0.addColorStop(1,'rgba(240,140,60,0)');
    ctx.fillStyle = g0; ctx.fillRect(0,0,W,H);

    // screen-wide warm overlay during burn and coal
    if (warm > .02){
      ctx.globalCompositeOperation = 'lighter';
      const cx = (phase === 'burning' || coal) ? vortexX : W/2;
      const cy = (phase === 'burning' || coal) ? vortexY : H/2;
      const wg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H) * .95);
      wg.addColorStop(0,   `rgba(255,150,70,${.10 + .18*warm})`);
      wg.addColorStop(.45, `rgba(255,110,40,${.05*warm})`);
      wg.addColorStop(1,   'rgba(255,110,40,0)');
      ctx.fillStyle = wg; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation = 'source-over';
    }

    // smoke behind everything
    for (const s of smoke){
      const gg = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);
      gg.addColorStop(0, `rgba(150,125,100,${.13*s.life})`);
      gg.addColorStop(1, 'rgba(150,125,100,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(s.x-s.r, s.y-s.r, s.r*2, s.r*2);
    }

    /* whirl sparks with short comet trails */
    if (phase === 'burning' || coal){
      ctx.globalCompositeOperation = 'lighter';
      for (const s of whirl){
        if (s.px && s.py){
          ctx.strokeStyle = 'rgba(255,180,90,.35)';
          ctx.lineWidth = s.size * .8;
          ctx.beginPath();
          ctx.moveTo(s.px, s.py);
          ctx.lineTo(s.x, s.y);
          ctx.stroke();
        }
        const flick = .6 + .4*Math.sin(ts*.01 + s.seed);
        ctx.globalAlpha = flick;
        ctx.fillStyle = '#ffd28a';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, 6.28); ctx.fill();
        const gg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 6);
        gg.addColorStop(0, 'rgba(255,190,100,.45)');
        gg.addColorStop(1, 'rgba(255,190,100,0)');
        ctx.globalAlpha = flick * .8;
        ctx.fillStyle = gg;
        ctx.fillRect(s.x-s.size*6, s.y-s.size*6, s.size*12, s.size*12);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // text particles
    for (const p of parts){
      if (!p.lit){
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#f0e2d4';
        ctx.fillRect(p.x, p.y, p.size, p.size);
        continue;
      }
      const h = Math.max(0, Math.min(1, p.heat));
      const g2 = Math.round(45 + 205 * h);
      const b2 = Math.round(15 + 195 * Math.pow(h, 1.6));
      ctx.globalAlpha = Math.min(1, p.life * 1.4);
      ctx.fillStyle = `rgb(255,${g2},${b2})`;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // coal
    if (coal){
      const t = (performance.now() - coal.stateT) / 1000;
      const scale = Math.min(W, H) / 800;
      let radius = (10 + Math.sqrt(absorbed) * 3.4) * scale;
      let alpha = 1, heat = 1;
      if (coal.state === 'flare'){
        const k = Math.min(1, t / .55);
        radius *= 1 + k * 1.1;
        heat = 1;
      } else if (coal.state === 'contract'){
        const k = Math.min(1, t / 1.6);
        radius *= (1 - k);
        alpha = 1 - k;
        heat = 1 - k * .6;
      }
      if (radius > .5){
        const gC = Math.round(180 + 70 * heat);
        const bC = Math.round(60 + 180 * Math.pow(heat, 1.5));
        ctx.globalCompositeOperation = 'lighter';
        const grd = ctx.createRadialGradient(coal.x, coal.y, 0, coal.x, coal.y, radius * 5.5);
        grd.addColorStop(0,   `rgba(255,${gC},${bC},${.95 * alpha})`);
        grd.addColorStop(.28, `rgba(255,${Math.round(gC*.85)},${Math.round(bC*.55)},${.55 * alpha})`);
        grd.addColorStop(.62, `rgba(220,80,20,${.22 * alpha})`);
        grd.addColorStop(1,   `rgba(140,0,0,0)`);
        ctx.fillStyle = grd;
        ctx.fillRect(coal.x - radius*5.5, coal.y - radius*5.5, radius*11, radius*11);
        ctx.fillStyle = `rgba(255,250,240,${alpha})`;
        ctx.beginPath(); ctx.arc(coal.x, coal.y, radius * .45, 0, 6.28); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // shockwaves
    for (const w of waves){
      ctx.strokeStyle = `rgba(255,180,110,${w.life * .8})`;
      ctx.lineWidth = 2 + 4 * w.life;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, 6.28); ctx.stroke();
      ctx.strokeStyle = `rgba(255,240,200,${w.life * .35})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r * .85, 0, 6.28); ctx.stroke();
    }

    // embers on top, additive
    ctx.globalCompositeOperation = 'lighter';
    for (const e of embers){
      const flick = .6 + .4*Math.sin(ts*.012 + e.seed);
      ctx.globalAlpha = e.life * flick;
      ctx.fillStyle = '#ffb060';
      ctx.beginPath(); ctx.arc(e.x, e.y, 1.5, 0, 6.28); ctx.fill();
      const gg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, 12);
      gg.addColorStop(0, `rgba(255,214,150,${.55*e.life})`);
      gg.addColorStop(.4, `rgba(255,170,90,${.34*e.life})`);
      gg.addColorStop(1, 'rgba(255,150,70,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(e.x-12, e.y-12, 24, 24);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // subtle vignette intensifies with warm
    if (warm > .05){
      const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*.3, W/2, H/2, Math.max(W,H)*.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, `rgba(0,0,0,${.35 * warm})`);
      ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
    }
  }

  /* The loop parks itself whenever the room is fully at rest, so the resting
     frame (base ember glow only) is painted once — not repainted forever.
     burn()/resize()/state changes call scheduleFrame() to wake it. */
  function atRest(){
    if (phase === 'burning' || coal) return false;
    return parts.length === 0 && embers.length === 0 && smoke.length === 0 &&
           waves.length === 0 && warm <= .01 && shake <= .05;
  }
  function scheduleFrame(){
    if (!rafId) rafId = requestAnimationFrame(frame);
  }
  function frame(ts){
    rafId = 0;
    const dt = Math.min(3, (ts-last)/16.667 || 1); last = ts;
    update(dt);
    draw(ts);
    if (!atRest()) rafId = requestAnimationFrame(frame);
  }
  scheduleFrame();

  ta.addEventListener('input', ()=>{ go.disabled = !ta.value.trim(); });
  ta.addEventListener('keydown', e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) burn(); });
  go.addEventListener('click', burn);

  again.addEventListener('click', () => {
    if (phase !== 'done') return;
    phase = 'idle'; timeScale = 1; warm = 0; shake = 0;
    parts.length = 0; embers.length = 0; smoke.length = 0; waves.length = 0; coal = null;
    for (const s of whirl){ s.radius = 80 + Math.random()*260; s.angle = Math.random()*6.28; s.px = 0; s.py = 0; }
    ta.value = ''; ta.disabled = false; go.disabled = true;
    card.classList.remove('gone'); card.inert = false;
    after.classList.remove('show'); after.inert = true;
    status.textContent = '';
    scheduleFrame(); // repaint a clean resting frame if the loop had parked
    ta.focus({ preventScroll: true });
  });
})();
</script>
</body>
</html>
