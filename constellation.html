<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Constellation</title>
<meta name="description" content="Release thoughts into a sky, then connect the stars that belong together.">
<meta name="theme-color" content="#06060f">
<style>
:root{--ink:#dce4fa;--mute:#8892b0;--dim:#4e5875;--line:rgba(170,190,240,.16);--accent:190,215,255}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#06060f;color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;
  touch-action:none;cursor:grab}
#c.grabbing{cursor:grabbing}
#c.placing{cursor:crosshair}
#c.star{cursor:pointer}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:5;
  width:40px;height:40px;display:grid;place-items:center;border-radius:999px;
  color:var(--mute);text-decoration:none;border:1px solid var(--line);
  background:rgba(10,12,24,.55);backdrop-filter:blur(8px);
  box-shadow:0 8px 24px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
  transition:color .18s,border-color .18s,background .18s,transform .15s}
.back:hover{color:var(--ink);border-color:rgba(var(--accent),.5);background:rgba(var(--accent),.1)}
.back:active{transform:scale(.94)}
.topright{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:5;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;height:40px;border-radius:999px;
  color:var(--mute);font-size:12px;letter-spacing:.08em;
  background:rgba(10,12,24,.55);backdrop-filter:blur(8px);
  border:1px solid var(--line);
  box-shadow:0 8px 24px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
  transition:color .18s,border-color .18s,background .18s,box-shadow .18s,transform .15s}
.pill:hover{color:var(--ink);border-color:rgba(var(--accent),.5);background:rgba(var(--accent),.1)}
.pill:active{transform:scale(.94)}
.pill svg{width:14px;height:14px;flex:none}
.pill.icon-only{padding:0;width:40px;justify-content:center}
.pill .badge{
  display:inline-block;padding:1px 6px;margin-left:2px;
  font-size:10px;letter-spacing:.04em;font-style:italic;
  font-variant-numeric:tabular-nums;
  color:#dfe6ff;background:rgba(var(--accent),.18);border-radius:999px}
.pill .x{display:none}
.pill.muted .w{display:none}
.pill.muted .x{display:inline}
.toggle{cursor:pointer}
.toggle input{
  appearance:none;-webkit-appearance:none;
  width:14px;height:14px;flex:none;
  border:1px solid rgba(var(--accent),.55);border-radius:4px;
  background:transparent;position:relative;
  transition:background .25s,border-color .25s;
  cursor:pointer;outline:none;margin:0}
.toggle input:checked{
  background:rgba(var(--accent),.55);
  border-color:rgba(var(--accent),.95)}
.toggle input:checked::after{
  content:'✓';
  position:absolute;inset:0;
  display:grid;place-items:center;
  font-size:10px;color:#0a0c18;line-height:1;
  font-weight:600;
  font-family:-apple-system,sans-serif}
.toggle input:focus-visible{outline:2px solid rgba(var(--accent),.6);outline-offset:2px}
.toggle:hover{color:var(--ink);border-color:rgba(var(--accent),.5)}
.toggle.checked{
  color:var(--ink);
  background:rgba(var(--accent),.12);
  border-color:rgba(var(--accent),.5)}
.info{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);
  z-index:4;color:var(--dim);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  font-style:italic;pointer-events:none;text-align:center;line-height:1.6;padding:0 16px}
.info b{color:var(--mute);font-weight:400}
.compose{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  transform:translateX(-50%);z-index:3;
  width:min(480px,calc(100% - 36px));
  display:flex;gap:8px;align-items:center;
  background:rgba(10,14,26,.82);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);border-radius:999px;
  padding:8px 8px 8px 20px;
  box-shadow:0 18px 50px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
  transition:opacity .4s ease,border-color .4s ease,box-shadow .4s ease}
.compose.armed{border-color:rgba(var(--accent),.55);box-shadow:0 0 40px -6px rgba(var(--accent),.28),inset 0 1px 0 rgba(255,255,255,.06)}
.compose input{flex:1;background:none;border:0;outline:none;color:var(--ink);
  font:300 15px/1.4 inherit;padding:8px 0;min-width:0}
.compose input::placeholder{color:var(--dim);font-style:italic}
.compose input:focus-visible{outline:2px solid rgba(var(--accent),.85);outline-offset:3px;border-radius:8px}
.compose button{font:inherit;cursor:pointer;
  padding:9px 20px;min-height:38px;border-radius:999px;
  font-size:13px;letter-spacing:.08em;color:#e8eeff;
  border:1px solid rgba(var(--accent),.4);
  background:linear-gradient(rgba(var(--accent),.18),rgba(var(--accent),.05));
  transition:box-shadow .2s,border-color .2s,background .2s,color .2s,transform .15s,opacity .3s;
  white-space:nowrap}
.compose button:hover:not(:disabled){box-shadow:0 0 22px rgba(var(--accent),.3);border-color:rgba(var(--accent),.75)}
.compose button:active:not(:disabled){transform:scale(.94)}
.compose button:disabled{opacity:.35;cursor:default}
.compose button.ghost{background:none;color:var(--mute);border-color:var(--line)}
.compose button.ghost:hover:not(:disabled){color:var(--ink);border-color:rgba(var(--accent),.55);background:rgba(var(--accent),.1);box-shadow:none}
.overlay{position:fixed;z-index:6;display:none;
  padding:8px 10px;border-radius:16px;
  background:rgba(12,16,30,.9);backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 24px 60px -22px rgba(0,0,0,.95),0 0 30px -14px rgba(var(--accent),.45),
    inset 0 1px 0 rgba(255,255,255,.06);
  gap:8px;align-items:center}
.overlay.show{display:flex}
.overlay.edit{z-index:8}
.overlay .label{
  color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-style:italic;padding:0 4px 0 6px;white-space:nowrap}
.overlay input{background:none;border:0;outline:none;color:var(--ink);
  font:300 14px/1.4 inherit;padding:6px 10px;min-width:180px}
.overlay input::placeholder{color:var(--dim);font-style:italic}
.overlay input:focus-visible{outline:2px solid rgba(var(--accent),.85);outline-offset:3px;border-radius:8px}
.overlay button{font:inherit;cursor:pointer;padding:6px 14px;min-height:34px;border-radius:999px;
  font-size:12px;letter-spacing:.06em;color:#e8eeff;
  border:1px solid rgba(var(--accent),.4);
  background:rgba(var(--accent),.12);
  transition:background .18s,border-color .18s,color .18s,transform .15s}
.overlay button:hover{background:rgba(var(--accent),.22);border-color:rgba(var(--accent),.7)}
.overlay button:active{transform:scale(.94)}
.overlay button.ghost{background:none;color:var(--mute);border-color:var(--line)}
.overlay button.ghost:hover{color:var(--ink);border-color:rgba(var(--accent),.5);background:rgba(var(--accent),.08)}
.ctx{position:fixed;z-index:9;display:none;flex-direction:column;
  padding:5px;min-width:150px;
  background:rgba(12,16,30,.94);backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;
  box-shadow:0 24px 60px -22px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);
  animation:ctxIn .14s ease}
.ctx.show{display:flex}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.ctx button{font:inherit;cursor:pointer;padding:9px 14px;
  background:none;border:0;border-radius:9px;
  color:var(--ink);font-size:13px;text-align:left;
  display:flex;align-items:center;gap:10px;
  transition:background .18s,color .18s,transform .15s}
.ctx button:hover{background:rgba(var(--accent),.12)}
.ctx button:active{transform:scale(.96)}
.ctx button.danger:hover{background:rgba(255,120,120,.16);color:#ffc8c8}
.ctx .ctx-icon{width:14px;height:14px;flex:none;opacity:.7}
.ctx .sep{height:1px;margin:4px 6px;background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
  transform:translateX(-50%) translateY(6px);
  padding:9px 18px;border-radius:999px;
  background:rgba(10,14,26,.92);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 16px 40px -18px rgba(0,0,0,.95),0 0 24px -16px rgba(var(--accent),.5);
  color:#dce4fa;font-size:12.5px;letter-spacing:.04em;
  opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;z-index:10;
  font-style:italic;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.panel{position:fixed;top:0;right:0;z-index:7;
  height:100vh;height:100dvh;
  width:min(380px,92vw);
  background:rgba(8,10,20,.92);backdrop-filter:blur(18px) saturate(1.15);
  border-left:1px solid rgba(255,255,255,.1);
  border-radius:20px 0 0 20px;
  box-shadow:-30px 0 80px -30px rgba(0,0,0,.95),inset 1px 0 0 rgba(255,255,255,.04);
  transform:translateX(100%);
  visibility:hidden;
  transition:transform .24s cubic-bezier(.2,.7,.3,1),visibility 0s linear .24s;
  display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.panel.open{transform:translateX(0);visibility:visible;
  transition:transform .24s cubic-bezier(.2,.7,.3,1),visibility 0s}
.panel-head{display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-weight:300;font-size:15px;letter-spacing:.12em;
  color:var(--ink);text-transform:uppercase}
.panel-head .head-actions{display:flex;align-items:center;gap:8px}
.panel-head .clear{font:inherit;cursor:pointer;
  min-height:36px;padding:6px 14px;border-radius:999px;
  font-size:11px;letter-spacing:.08em;font-variant-numeric:tabular-nums;
  color:var(--dim);background:none;
  border:1px solid var(--line);
  transition:color .18s,border-color .18s,background .18s,box-shadow .18s,transform .15s;
  white-space:nowrap}
.panel-head .clear:hover{color:#ffb4b4;border-color:rgba(255,140,140,.4)}
.panel-head .clear:active{transform:scale(.94)}
.panel-head .clear.armed{
  color:#ffc8c8;
  border-color:rgba(255,120,120,.75);
  background:rgba(255,120,120,.16);
  box-shadow:0 0 18px rgba(255,120,120,.24)}
.panel-head .close{width:38px;height:38px;border-radius:999px;
  display:grid;place-items:center;background:none;border:1px solid var(--line);
  color:var(--mute);cursor:pointer;font-size:17px;line-height:1;padding:0;
  transition:color .18s,border-color .18s,background .18s,transform .15s}
.panel-head .close:hover{color:var(--ink);border-color:rgba(var(--accent),.5);background:rgba(var(--accent),.08)}
.panel-head .close:active{transform:scale(.94)}
.panel-body{flex:1;overflow-y:auto;padding:10px 10px 14px}
.panel-empty{color:var(--dim);font-size:13px;font-style:italic;
  padding:40px 20px;text-align:center;line-height:1.7}
.row{display:flex;gap:10px;align-items:flex-start;
  padding:12px;margin:5px 0;
  border-radius:14px;cursor:pointer;
  border:1px solid transparent;
  transition:background .2s,border-color .2s}
.row:hover{background:rgba(var(--accent),.06);border-color:rgba(var(--accent),.18)}
.row:focus-within{background:rgba(var(--accent),.07);border-color:rgba(var(--accent),.32)}
.row.focused{background:rgba(255,225,160,.07);border-color:rgba(255,225,160,.28)}
.star-dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;
  background:var(--c,#9aa7c7);
  box-shadow:0 0 10px var(--c,#9aa7c7),0 0 3px var(--c,#9aa7c7)}
.row-main{flex:1;min-width:0;
  display:block;background:none;border:0;padding:0;margin:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:8px}
.row-text{display:block;font-size:14px;line-height:1.5;color:var(--ink);
  word-break:break-word;margin:0 0 5px}
.row-meta{display:block;font-size:10.5px;letter-spacing:.06em;color:var(--dim);
  font-style:italic;text-transform:uppercase;font-variant-numeric:tabular-nums}
.row-cluster{color:#e5d8a8;font-style:italic;text-transform:none;letter-spacing:.02em;font-size:11px;margin-left:6px}
.row-actions{display:flex;gap:4px;flex:none;align-self:center;
  opacity:0;transition:opacity .2s}
.row:hover .row-actions,
.row:focus-within .row-actions{opacity:1}
.row-actions button{
  width:32px;height:32px;border-radius:999px;
  display:grid;place-items:center;
  background:none;border:1px solid transparent;
  color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:0;
  transition:color .18s,border-color .18s,background .18s,transform .15s}
.row-actions button:hover{color:var(--ink);border-color:rgba(var(--accent),.4);background:rgba(var(--accent),.08)}
.row-actions button:active{transform:scale(.94)}
.row-actions button.del:hover{color:#ffb4b4;border-color:rgba(255,140,140,.5)}
.panel-backdrop{position:fixed;inset:0;z-index:6;
  background:rgba(2,3,8,.4);
  opacity:0;pointer-events:none;transition:opacity .24s}
.panel-backdrop.show{opacity:1;pointer-events:auto}
/* one consistent focus ring across the room */
:focus-visible{outline:2px solid rgba(var(--accent),.85);outline-offset:2px}
#c:focus-visible{outline:2px solid rgba(var(--accent),.6);outline-offset:-4px}
.info{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Star sky. Press Enter or Space to place a star at the center of the view, or to select the star at the center."></canvas>
<a class="back" href="index.html" aria-label="Back to the shelf"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>

<div class="topright">
  <button class="pill icon-only" id="muteBtn" aria-label="Mute sound" aria-pressed="false">
    <svg class="w" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>
      <path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>
    </svg>
    <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>
      <path d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>
  <label class="pill toggle" id="showAllToggle">
    <input type="checkbox" id="showAll">
    Show all text
  </label>
  <button class="pill" id="allBtn" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M4 12h16M4 18h10"/>
    </svg>
    All thoughts <span class="badge" id="countBadge">0</span>
  </button>
</div>

<p class="info" id="info"></p>

<div class="compose" id="compose">
  <input id="thought" maxlength="140" placeholder="A thought to release into the sky…" autocomplete="off" aria-label="A thought to release">
  <button id="go" disabled>Release</button>
  <button id="placeBtn" class="ghost" disabled aria-label="Place the star at the center of the view" title="Place at the center of the view">Place</button>
</div>

<div class="overlay" id="overlay">
  <span class="label">Name</span>
  <input id="nameInput" maxlength="40" placeholder="Name this constellation…" autocomplete="off" aria-label="Constellation name">
  <button id="nameSave">Save</button>
  <button class="ghost" id="nameCancel">Cancel</button>
</div>

<div class="overlay edit" id="editOverlay">
  <span class="label">Edit</span>
  <input id="editInput" maxlength="140" placeholder="Edit this thought…" autocomplete="off" aria-label="Edit this thought">
  <button id="editSave">Save</button>
  <button class="ghost" id="editCancel">Cancel</button>
</div>

<div class="ctx" id="ctxMenu" role="menu" aria-hidden="true">
  <button data-action="edit" role="menuitem">
    <svg class="ctx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M14 6l4 4"/></svg>
    Edit text
  </button>
  <button data-action="focus" role="menuitem">
    <svg class="ctx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
    Center on star
  </button>
  <div class="sep"></div>
  <button data-action="delete" class="danger" role="menuitem">
    <svg class="ctx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12"/></svg>
    Delete star
  </button>
</div>

<p class="toast" id="toast" role="status" aria-live="polite"></p>

<div class="panel-backdrop" id="panelBackdrop"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-label="All thoughts" aria-hidden="true" inert>
  <div class="panel-head">
    <h2>All thoughts</h2>
    <div class="head-actions">
      <button class="clear" id="clearAll" aria-label="Clear all thoughts">Clear all</button>
      <button class="close" id="panelClose" aria-label="Close">×</button>
    </div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const canvas = $('#c'), ctx = canvas.getContext('2d');
  const info = $('#info'), compose = $('#compose'), thoughtEl = $('#thought'), goBtn = $('#go'), placeBtn = $('#placeBtn');
  const overlay = $('#overlay'), nameInput = $('#nameInput'), nameSave = $('#nameSave'), nameCancel = $('#nameCancel');
  const editOverlay = $('#editOverlay'), editInput = $('#editInput'), editSave = $('#editSave'), editCancel = $('#editCancel');
  const ctxMenu = $('#ctxMenu');
  const toastEl = $('#toast');
  const allBtn = $('#allBtn'), countBadge = $('#countBadge');
  const showAllToggle = $('#showAllToggle'), showAllInput = $('#showAll');
  const panel = $('#panel'), panelBody = $('#panelBody'), panelClose = $('#panelClose'), panelBackdrop = $('#panelBackdrop');
  const clearAllBtn = $('#clearAll');
  const muteBtn = $('#muteBtn');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ==================== AUDIO ==================== */
  let AC = null, master = null, ambient = null;
  let muted = false;
  try { muted = localStorage.getItem('constellation:muted') === '1'; } catch(e){}

  function ensureAudio(){
    if (!AC){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      try { AC = new Ctx(); } catch(e){ return false; }
      master = AC.createGain();
      master.gain.value = muted ? 0 : .7;
      master.connect(AC.destination);
    }
    if (AC.state !== 'running'){
      const p = AC.resume();
      if (p && p.catch) p.catch(()=>{});
    }
    return true;
  }

  // unlock on first user gesture
  ['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
    addEventListener(ev, () => {
      if (ensureAudio() && !ambient && stars.length > 0) startAmbient();
      if (ambient) updateAmbient();
    }, { passive: true }));

  function playToneAt(freq, t, opts = {}){
    if (!AC || muted) return;
    const { type = 'sine', attack = .01, decay = .3, vol = .1, freqEnd = null, glideTime = null } = opts;
    const o = AC.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd != null){
      o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + (glideTime || decay));
    }
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + attack + decay + .2);
  }
  function playTone(opts){
    if (!ensureAudio() || muted) return;
    playToneAt(opts.freq, AC.currentTime, opts);
  }
  function playNoiseAt(t, opts = {}){
    if (!AC || muted) return;
    const { dur = .15, vol = .04, freq = 1500, q = 1, filterType = 'bandpass' } = opts;
    const buf = AC.createBuffer(1, Math.max(1, Math.ceil(AC.sampleRate * dur)), AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + .05);
  }

  function startAmbient(){

  /* ==================== star operations ==================== */
  function findStarAt(wx, wy){
    let best = null, bestD = Infinity;
    for (const s of stars){
      const dx = s.x - wx, dy = s.y - wy;
      const d = dx*dx + dy*dy;
      if (d < bestD && d < 24 * 24){ best = s; bestD = d; }
    }
    return best;
  }

  function removeStar(id, skipSound){
    const before = stars.length;
    stars = stars.filter(s => s.id !== id);
    if (stars.length === before) return;
    connections = connections.filter(c => c.a !== id && c.b !== id);

    markGraphDirty();

    closeNamer();

    return n;

  function connect(aId, bId){
    if (aId === bId) return;
    const exists = connections.find(c => (c.a === aId && c.b === bId) || (c.a === bId && c.b === aId));
    if (exists) return;
    connections.push({ a: aId, b: bId, t: 0 });
    markGraphDirty();
    sfxLink();
    save(); refreshInfo(); refreshPanel();
  }

  function components(){
    const adj = new Map();
    for (const s of stars) adj.set(s.id, new Set());
    for (const c of connections){
      if (adj.has(c.a) && adj.has(c.b)){
        adj.get(c.a).add(c.b);
        adj.get(c.b).add(c.a);
      }
    }
    const seen = new Set();
    const comps = [];
    for (const s of stars){
      if (seen.has(s.id)) continue;
      const queue = [s.id];
      const members = [];
      while (queue.length){
        const id = queue.pop();
        if (seen.has(id)) continue;
        seen.add(id);
        members.push(id);
        for (const nb of adj.get(id) || []) if (!seen.has(nb)) queue.push(nb);
      }
      comps.push(members);
    }
    return comps;
  }

  // recomputed only when stars/connections change, reused every frame otherwise
  function getComponents(){
    if (compsDirty){
      compsCache = components();
      compsDirty = false;
    }
    return compsCache;
  }

  function clusterKey(members){
    let oldest = null, oldestAt = Infinity;
    for (const id of members){
      const s = starById.get(id);
      if (!s) continue;
      if (s.at < oldestAt){ oldestAt = s.at; oldest = id; }
    }
    return oldest;
  }

  function centroid(members){
    let sx = 0, sy = 0, n = 0;
    for (const id of members){
      const s = starById.get(id);
      if (!s) continue;
      sx += s.x; sy += s.y; n++;
    }
    return n ? { x: sx/n, y: sy/n } : null;
  }

  // star id -> the members of its component (built once per panel render)
  function componentIndex(){
    const idx = new Map();
    for (const members of getComponents()){
      for (const id of members) idx.set(id, members);
    }
    return idx;
  }

      if (!panel.classList.contains('open')) return;
      try { panelClose.focus({ preventScroll: true }); } catch(_){}
    }, 30);
  }
  function closePanel(){
    const wasOpen = panel.classList.contains('open');
    disarmClear();
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
    panel.setAttribute('inert', '');
    panelBackdrop.classList.remove('show');
    allBtn.setAttribute('aria-expanded', 'false');
    if (wasOpen){
      const active = document.activeElement;
      if (!active || active === document.body || panel.contains(active) || !allBtn.isConnected){
        restoreFocus(allBtn, canvas);
      }
    }
  }
  allBtn.addEventListener('click', () => {
    if (panel.classList.contains('open')) closePanel();
    else openPanel();
  });
  panelClose.addEventListener('click', closePanel);
  panelBackdrop.addEventListener('click', closePanel);

  // keep Tab inside the modal panel while it is open
  panel.addEventListener('keydown', e => {
    if (e.key !== 'Tab' || !panel.classList.contains('open')) return;
    const items = Array.from(panel.querySelectorAll('button, input, [href], [tabindex]:not([tabindex="-1"])'))
      .filter(el => !el.disabled && el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  clearAllBtn.addEventListener('click', () => {
    if (stars.length === 0){ toast('Nothing to clear.'); return; }
    if (!clearAllBtn.classList.contains('armed')){
      clearAllBtn.classList.add('armed');
      clearAllBtn.textContent = `Confirm · ${stars.length}?`;
      clearAllBtn.setAttribute('aria-label', `Confirm: delete all ${stars.length} stars`);
      clearTimeout(clearArmedT);
      clearArmedT = setTimeout(disarmClear, 3500);
      return;
    }
    disarmClear();
    const n = removeAllStars();
    sfxClear();
    toast(`Cleared ${n} star${n===1?'':'s'}.`);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if (panel.classList.contains('open')) closePanel();
      else if (editOverlay.classList.contains('show')) closeEditor();
      else if (overlay.classList.contains('show')) closeNamer();
    }
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  // recomputed only while the panel is actually on screen; a closed panel
  // just waits and is rendered fresh the next time it opens
  function refreshPanel(){
    if (!panel.classList.contains('open')) return;
    renderPanel();
  }

  function renderPanel(){
    if (stars.length === 0){
      panelBody.innerHTML = '<p class="panel-empty">Nothing up here yet.<br>Write something below and place a star.</p>';
      return;
    }
    const compIdx = componentIndex();
    const sorted = stars.slice().sort((a,b) => b.at - a.at);
    panelBody.innerHTML = sorted.map(s => {
      const members = compIdx.get(s.id);
      const cluster = (members && members.length >= 3) ? { key: clusterKey(members), members } : null;
      const clusterName = cluster ? clusters[cluster.key] : null;
      const isFocused = s.id === selectedStar;
      const date = new Date(s.at).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
      const eid = escapeHtml(s.id);
      return `<div class="row${isFocused ? ' focused' : ''}" data-id="${eid}">
        <span class="star-dot" style="--c:${cssHueColor(s.hue, .9)}"></span>
        <button type="button" class="row-main" aria-label="Show in the sky — ${escapeHtml(s.text)}, ${date}">
          <span class="row-text">${escapeHtml(s.text)}</span>
          <span class="row-meta">${date}${clusterName ? `<span class="row-cluster">· ${escapeHtml(clusterName)}</span>` : ''}</span>
        </button>
        <div class="row-actions">
          <button type="button" data-edit="${eid}" aria-label="Edit this thought" title="Edit">✎</button>
          <button type="button" class="del" data-del="${eid}" aria-label="Delete this thought" title="Delete">×</button>
        </div>
      </div>`;
    }).join('');

    panelBody.querySelectorAll('.row').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('[data-edit]') || e.target.closest('[data-del]')) return;
        focusOnStar(el.dataset.id);
        closePanel();
      });
    });
    panelBody.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        openEditorFor(btn.dataset.edit);
      });
    });
    panelBody.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = btn.dataset.del;
        if (confirm('Delete this thought?')){
          removeStar(id);
          // the row (and its button) is gone after re-render — keep focus in the panel
          const active = document.activeElement;
          if (!active || active === document.body || !panel.contains(active)){
            try { panelClose.focus({ preventScroll: true }); } catch(_){}
          }
        }
      });
    });
  }

  function focusOnStar(id){
    const s = starById.get(id);
    if (!s) return;
    camTarget = { x: s.x, y: s.y };
    selectedStar = id;
  }

  /* ==================== pointer ==================== */
  canvas.addEventListener('pointerdown', e => {
    if (pointerDown) return;          // one pointer at a time — keeps drag math honest
    if (e.button === 2) return;
    hideCtxMenu();

    const world = screenToWorld(e.clientX, e.clientY);
    const star = findStarAt(world.x, world.y);
    camTarget = null;

    pointerDown = {
      sx: e.clientX, sy: e.clientY,
      camX, camY,
      world,
      starId: star ? star.id : null,
      grabDX: star ? world.x - star.x : 0,   // grab offset: the star keeps its place under the cursor
      grabDY: star ? world.y - star.y : 0,
      moved: false,
      t: performance.now()
    };
    canvas.classList.add('grabbing');
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}

    clearTimeout(longPressTimer);
    if (star){
      const starId = star.id;
      const sx = e.clientX, sy = e.clientY;
      longPressTimer = setTimeout(() => {
        if (pointerDown && !pointerDown.moved && pointerDown.starId === starId){
          pointerDown = null;
          canvas.classList.remove('grabbing');
          try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
          showCtxMenu(starId, sx, sy);
        }
      }, 550);
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (!pointerDown){
      const w = screenToWorld(e.clientX, e.clientY);
      const s = findStarAt(w.x, w.y);
      const prev = hoverStar;
      hoverStar = s ? s.id : null;
      if (prev !== hoverStar) canvas.classList.toggle('star', !!hoverStar);
      return;
    }

    const dx = e.clientX - pointerDown.sx;
    const dy = e.clientY - pointerDown.sy;
    if (!pointerDown.moved && Math.hypot(dx, dy) > 5){
      pointerDown.moved = true;
      clearTimeout(longPressTimer);
    }

    if (pointerDown.moved){
      if (pointerDown.starId){
        const w = screenToWorld(e.clientX, e.clientY);
        const s = starById.get(pointerDown.starId);
        if (s){ s.x = w.x - pointerDown.grabDX; s.y = w.y - pointerDown.grabDY; }
      } else {
        camX = pointerDown.camX - dx / zoom;
        camY = pointerDown.camY - dy / zoom;
      }
    } else if (selectedStar){
      const a = starById.get(selectedStar);
      if (a){
        const w = screenToWorld(e.clientX, e.clientY);
        linkingAnimation = { from: a, toX: w.x, toY: w.y };
      }
    }
  });

  function hitLabel(sx, sy){
    for (const r of labelHits){
      if (sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h) return r.starId;
    }
    return null;
  }

  function endPointer(e){
    clearTimeout(longPressTimer);
    if (!pointerDown) return;
    canvas.classList.remove('grabbing');
    try { canvas.releasePointerCapture(e.pointerId); } catch(_){}

    const held = performance.now() - pointerDown.t;
    const wasMoved = pointerDown.moved;
    const starId = pointerDown.starId;
    const world = pointerDown.world;
    const clickX = e.clientX, clickY = e.clientY;
    pointerDown = null;
    linkingAnimation = null;

    if (wasMoved){
      if (starId) save();
      return;
    }
    if (held > 600) return;

    for (const a of nameAffordances){
      if (Math.hypot(clickX - a.x, clickY - a.y) < a.r + 8){
        openNamerFor(a.key, a.world);
        return;
      }
    }
    if (sCluster){
      const dx = Math.abs(clickX - sCluster.x);
      const dy = Math.abs(clickY - sCluster.y);
      if (dx < sCluster.w / 2 + 6 && dy < 16){
        openNamerFor(sCluster.key, sCluster.world);
        return;
      }
    }

    const labelId = hitLabel(clickX, clickY);
    if (labelId){
      openEditorFor(labelId);
      return;
    }

    if (placing){
      placeStarAt(world.x, world.y);
      return;
    }

    if (starId){
      if (!selectedStar){
        selectedStar = starId;
        sfxSelect();
      } else if (selectedStar === starId){
        selectedStar = null;
        sfxDeselect();
      } else {
        connect(selectedStar, starId);
        toast('Linked.');
        selectedStar = null;
      }
    } else {
      if (selectedStar){ selectedStar = null; sfxDeselect(); }
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const world = screenToWorld(e.clientX, e.clientY);
    const s = findStarAt(world.x, world.y);
    if (!s){ hideCtxMenu(); return; }
    showCtxMenu(s.id, e.clientX, e.clientY);
  });

  /* ==================== compose bar ==================== */
  function setComposeReady(ok){
    goBtn.disabled = !ok;
    placeBtn.disabled = !ok;
  }
  function cancelPlacing(){
    placing = false;
    compose.classList.remove('armed');
    canvas.classList.remove('placing');
  }
  function viewCenterWorld(){ return screenToWorld(W / 2, H / 2); }

  // one shared path for pointer, keyboard and the "Place" button
  function placeStarAt(wx, wy){
    const text = thoughtEl.value.trim();
    if (!text){ cancelPlacing(); return null; }
    addStar(wx, wy, text);
    thoughtEl.value = '';
    setComposeReady(false);
    cancelPlacing();
    selectedStar = stars[stars.length - 1].id;
    toast('Star placed. Click another star — or press Enter on it — to connect.');
    return selectedStar;
  }

  thoughtEl.addEventListener('input', () => {
    const ok = !!thoughtEl.value.trim();
    setComposeReady(ok);
    if (!ok && placing) cancelPlacing();
  });
  thoughtEl.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); armPlacement(); }
    if (e.key === 'Escape'){ cancelPlacing(); }
  });
  goBtn.addEventListener('click', armPlacement);
  placeBtn.addEventListener('click', () => {
    const c = viewCenterWorld();
    placeStarAt(c.x, c.y);
    // the button disables itself once the thought is released — keep typing going
    try { thoughtEl.focus({ preventScroll: true }); } catch(_){}
  });

  function armPlacement(){
    if (!thoughtEl.value.trim()) return;
    hideCtxMenu();
    placing = true;
    compose.classList.add('armed');
    canvas.classList.add('placing');
    sfxArm();
    toast('Click the sky — or press Enter on it — to place your star.');
  }

  /* keyboard on the sky: Enter/Space places at the view centre while armed,
     otherwise it selects (or links) the star nearest the centre */
  function canvasActivate(){
    hideCtxMenu();
    if (placing){
      const c = viewCenterWorld();
      placeStarAt(c.x, c.y);
      return;
    }
    const c = viewCenterWorld();
    let best = null, bestD = 90 * 90;
    for (const s of stars){
      const dx = s.x - c.x, dy = s.y - c.y;
      const d = dx * dx + dy * dy;
      if (d < bestD){ bestD = d; best = s; }
    }
    if (best){
      if (!selectedStar){
        selectedStar = best.id;
        sfxSelect();
      } else if (selectedStar === best.id){
        selectedStar = null;
        sfxDeselect();
      } else {
        connect(selectedStar, best.id);
        toast('Linked.');
        selectedStar = null;
      }
    } else if (selectedStar){
      selectedStar = null;
      sfxDeselect();
    } else {
      toast('The centre of the view is empty.');
    }
  }
  canvas.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      canvasActivate();
    } else if (e.key === 'Escape'){
      cancelPlacing();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      e.preventDefault();
      camTarget = null;
      const step = 120;
      if (e.key === 'ArrowLeft') camX -= step;
      if (e.key === 'ArrowRight') camX += step;
      if (e.key === 'ArrowUp') camY -= step;
      if (e.key === 'ArrowDown') camY += step;
    }
  });

  /* ==================== effects ==================== */
  function stepFX(dt){
    for (let i = ripples.length - 1; i >= 0; i--){
      const r = ripples[i];
      r.r += (r.max - r.r) * .05 * dt;
      r.life -= .02 * dt;
      if (r.life <= 0) ripples.splice(i, 1);
    }
    for (let i = bursts.length - 1; i >= 0; i--){
      const b = bursts[i];
      b.life -= .014 * dt;
      if (b.life <= 0){ bursts.splice(i, 1); continue; }
      b.vx *= .94; b.vy *= .94;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
    for (const c of connections){
      if (c.t < 1) c.t = Math.min(1, c.t + .035 * dt);
    }

    if (camTarget){
      camX += (camTarget.x - camX) * .08 * dt;
      camY += (camTarget.y - camY) * .08 * dt;
      if (Math.hypot(camTarget.x - camX, camTarget.y - camY) < 1) camTarget = null;
    }

    const now = performance.now();
    if (!shooting && now > nextShooting && !calm){
      const fromLeft = Math.random() < .5;
      shooting = {
        x: fromLeft ? -80 : W + 80,
        y: 60 + Math.random() * (H * .4),
        vx: (fromLeft ? 1 : -1) * (10 + Math.random() * 6),
        vy: 3 + Math.random() * 3,
        life: 1
      };
    }
    if (shooting){
      shooting.x += shooting.vx * dt;
      shooting.y += shooting.vy * dt;
      shooting.life -= .006 * dt;
      if (shooting.life <= 0 || shooting.x < -200 || shooting.x > W + 200){
        shooting = null;
        nextShooting = now + 12000 + Math.random() * 25000;
      }
    }
  }

  /* ==================== rendering ==================== */
  function draw(){
    const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * .85);
    bg.addColorStop(0, '#0a0d1e');
    bg.addColorStop(1, '#04050d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const n of nebulaClouds){
      const sc = worldToScreen(n.x, n.y);
      const rr = n.r * zoom;
      if (sc.x + rr < 0 || sc.x - rr > W || sc.y + rr < 0 || sc.y - rr > H) continue;
      const g = ctx.createRadialGradient(sc.x, sc.y, 0, sc.x, sc.y, rr);
      g.addColorStop(0, `rgba(${n.c[0]},${n.c[1]},${n.c[2]},${n.a})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sc.x, sc.y, rr, 0, 6.28); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = 'rgb(200, 215, 245)';
    for (const d of distantStars){
      const sx = (d.x - camX * d.par) * zoom + W/2;
      const sy = (d.y - camY * d.par) * zoom + H/2;
      if (sx < -4 || sx > W+4 || sy < -4 || sy > H+4) continue;
      ctx.globalAlpha = d.a;
      ctx.fillRect(sx, sy, d.r, d.r);
    }
    ctx.globalAlpha = 1;

    for (const c of connections){
      const a = starById.get(c.a);
      const b = starById.get(c.b);
      if (!a || !b) continue;
      const pa = worldToScreen(a.x, a.y);
      const pb = worldToScreen(b.x, b.y);
      const tipX = pa.x + (pb.x - pa.x) * c.t;
      const tipY = pa.y + (pb.y - pa.y) * c.t;
      drawLink(pa.x, pa.y, tipX, tipY, a.hue, b.hue, c.t);
    }

    if (linkingAnimation){
      const a = linkingAnimation.from;
      const pa = worldToScreen(a.x, a.y);
      const pb = worldToScreen(linkingAnimation.toX, linkingAnimation.toY);
      ctx.save();
      ctx.globalAlpha = .55;
      drawLink(pa.x, pa.y, pb.x, pb.y, a.hue, a.hue, 1, true);
      ctx.restore();
    }

    for (const s of stars){
      const p = worldToScreen(s.x, s.y);
      if (p.x < -60 || p.x > W + 60 || p.y < -60 || p.y > H + 60) continue;
      drawStar(s, p.x, p.y, s.id === hoverStar, s.id === selectedStar);
    }

    sCluster = null;
    nameAffordances = [];
    labelHits = [];

    if (showAllText){
      const placed = [];
      const sorted = stars.slice().sort((a,b) => {
        const pa = priority(a.id), pb = priority(b.id);
        if (pa !== pb) return pb - pa;
        return b.at - a.at;
      });
      for (const s of sorted){
        if (s.id === selectedStar || s.id === hoverStar) continue;
        const p = worldToScreen(s.x, s.y);
        if (p.x < 40 || p.x > W - 40 || p.y < 30 || p.y > H - 40) continue;
        const rect = labelRectFor(s.text, p.x, p.y + 26);
        let overlaps = false;
        for (const r of placed){
          if (!(rect.x + rect.w < r.x || rect.x > r.x + r.w ||
                rect.y + rect.h < r.y || rect.y > r.y + r.h)){
            overlaps = true; break;
          }
        }
        if (overlaps) continue;
        placed.push(rect);
        drawStarLabelAt(s.text, rect, true);
        labelHits.push({ ...rect, starId: s.id });
      }
    }

    if (selectedStar){
      const s = starById.get(selectedStar);
      if (s){
        const p = worldToScreen(s.x, s.y);
        const rect = labelRectFor(s.text, p.x, p.y + 26);
        drawStarLabelAt(s.text, rect, false, true);
        labelHits.push({ ...rect, starId: s.id });
      }
    } else if (hoverStar){
      const s = starById.get(hoverStar);
      if (s){
        const p = worldToScreen(s.x, s.y);
        const rect = labelRectFor(s.text, p.x, p.y + 26);
        drawStarLabelAt(s.text, rect, true, false);
        labelHits.push({ ...rect, starId: s.id });
      }
    }

    const comps = getComponents();
    for (const members of comps){
      if (members.length < 3) continue;
      const c = centroid(members);
      if (!c) continue;
      const p = worldToScreen(c.x, c.y);
      const key = clusterKey(members);
      const name = clusters[key];
      const sc = { x: p.x, y: p.y - 34 };

      if (name){
        drawClusterName(name, sc.x, sc.y);
        sCluster = { x: sc.x, y: sc.y, w: Math.max(80, name.length * 9 + 30), h: 24, key, world: c };
      } else {
        drawNameAffordance(sc.x, sc.y, key, c);
      }
    }

    for (const r of ripples){
      const p = worldToScreen(r.x, r.y);
      ctx.globalAlpha = r.life;
      ctx.strokeStyle = `rgba(200,220,255,${r.life * .6})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r.r * zoom, 0, 6.28);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bursts){
      const p = worldToScreen(b.x, b.y);
      ctx.globalAlpha = b.life;
      ctx.fillStyle = `hsla(${b.hue}, 80%, 85%, ${b.life})`;
      ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (shooting){
      ctx.globalCompositeOperation = 'lighter';
      const { x, y, vx, vy, life } = shooting;
      const len = 80;
      const mag = Math.hypot(vx, vy) || 1;
      const tx = x - (vx / mag) * len;
      const ty = y - (vy / mag) * len;
      const g = ctx.createLinearGradient(x, y, tx, ty);
      g.addColorStop(0, `rgba(255,255,255,${life * .9})`);
      g.addColorStop(.5, `rgba(200,220,255,${life * .3})`);
      g.addColorStop(1, 'rgba(200,220,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function priority(id){
    if (id === selectedStar) return 3;
    if (id === hoverStar) return 2;
    if (id === editingStarId) return 2;
    return 1;
  }

  function drawLink(ax, ay, bx, by, ha, hb, t, dashed){
    ctx.save();
    if (dashed) ctx.setLineDash([4, 6]);
    const g = ctx.createLinearGradient(ax, ay, bx, by);
    g.addColorStop(0, starColors(ha).c2);
    g.addColorStop(1, starColors(hb).c2);
    ctx.strokeStyle = g;
    ctx.globalAlpha = (.55 + .35 * t);
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .15 * t;
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  const starSpriteCache = new Map();
  function getStarSprite(hue){
    const bucket = Math.round(hue / 15) * 15;
    if (starSpriteCache.has(bucket)) return starSpriteCache.get(bucket);
    const size = 64;
    const o = document.createElement('canvas');
    o.width = size; o.height = size;
    const c = o.getContext('2d');
    const col = starColors(bucket);
    const g = c.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, col.c1);
    g.addColorStop(.14, col.c2);
    g.addColorStop(.4, col.c3);
    g.addColorStop(1, col.c4);
    c.fillStyle = g;
    c.fillRect(0, 0, size, size);
    starSpriteCache.set(bucket, o);
    return o;
  }

  function drawStar(s, x, y, hovered, selected){
    const tw = calm ? .9 : (.86 + .14 * Math.sin(time * .9 + s.phase));
    const baseR = 3 + s.brightness * 1.5;
    const coreR = baseR * (hovered || selected ? 1.4 : 1) * tw;
    const sprite = getStarSprite(s.hue);
    const drawR = coreR * 6;
    ctx.globalAlpha = .9;
    ctx.drawImage(sprite, x - drawR, y - drawR, drawR * 2, drawR * 2);
    ctx.globalAlpha = 1;

    ctx.fillStyle = `rgba(255,255,255,${.85 * tw})`;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(1, baseR * .55), 0, 6.28);
    ctx.fill();

    if (hovered && !selected){
      ctx.strokeStyle = `hsla(${s.hue}, 80%, 80%, .7)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, coreR * 2.4, 0, 6.28);
      ctx.stroke();
    }

    if (selected){
      const p = calm ? .9 : (.75 + .25 * Math.sin(time * 2.6));
      ctx.strokeStyle = `rgba(255,225,160,${.75 * p})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(x, y, coreR * 2.6, 0, 6.28);
      ctx.stroke();
      for (let i = 0; i < 3; i++){
        const a = calm ? i * 2.09 : (time * 1.4 + i * 2.09);
        const rr = coreR * 3.2;
        ctx.fillStyle = `rgba(255,240,200,${.8})`;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, 1.3, 0, 6.28);
        ctx.fill();
      }
    }
  }

  function labelRectFor(text, x, y){
    ctx.font = '13px "Iowan Old Style","Palatino Linotype",Georgia,serif';
    const pad = 8;
    const w = ctx.measureText(text).width;
    const bw = Math.min(W - 40, w + pad * 2);
    const bh = 24;
    const bx = Math.max(20, Math.min(W - 20, x)) - bw/2;
    const by = y - bh/2;
    return { x: bx, y: by, w: bw, h: bh };
  }

  function drawStarLabelAt(text, rect, dim, editable){
    ctx.fillStyle = 'rgba(10,14,28,.85)';
    roundRect(rect.x, rect.y, rect.w, rect.h, 12);
    ctx.fill();
    ctx.strokeStyle = editable
      ? 'rgba(255,225,160,.45)'
      : dim ? 'rgba(170,190,240,.12)' : 'rgba(200,220,255,.32)';
    ctx.lineWidth = 1;
    if (editable) ctx.setLineDash([3, 3]);
    ctx.stroke();
    if (editable) ctx.setLineDash([]);

    ctx.font = '13px "Iowan Old Style","Palatino Linotype",Georgia,serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const pad = 8;
    let display = text;
    while (ctx.measureText(display).width > rect.w - pad*2 && display.length > 1){
      display = display.slice(0, -2) + '…';
    }
    ctx.fillStyle = dim ? 'rgba(200,210,235,.65)' : 'rgba(230,238,255,.95)';
    ctx.fillText(display, rect.x + rect.w/2, rect.y + rect.h/2);

    if (editable){
      ctx.font = '10px "Iowan Old Style","Palatino Linotype",Georgia,serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,225,160,.7)';
      ctx.fillText('✎ edit', rect.x + 6, rect.y + rect.h/2);
    }
  }

  function drawClusterName(name, x, y){
    ctx.font = 'italic 13px "Iowan Old Style","Palatino Linotype",Georgia,serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = .35;
    ctx.fillStyle = 'rgba(255,235,200,0.8)';
    ctx.fillText(name, x, y);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,240,205,0.95)';
    ctx.fillText(name, x, y);
    const w = ctx.measureText(name).width;
    ctx.strokeStyle = 'rgba(255,225,170,.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - w/2, y + 9);
    ctx.lineTo(x + w/2, y + 9);
    ctx.stroke();
  }

  function drawNameAffordance(x, y, key, world){
    const p = calm ? 1 : (.7 + .3 * Math.sin(time * 3));
    ctx.globalAlpha = .45 * p;
    ctx.strokeStyle = 'rgba(200,220,255,1)';
    ctx.setLineDash([3, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, 6.28);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    ctx.fillStyle = 'rgba(220,232,255,.9)';
    ctx.fillRect(x - 4, y - .8, 8, 1.6);
    ctx.fillRect(x - .8, y - 4, 1.6, 8);

    ctx.font = 'italic 11px "Iowan Old Style","Palatino Linotype",Georgia,serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(200,215,245,.8)';
    ctx.fillText('name this', x, y + 22);

    nameAffordances.push({ x, y, r: 16, key, world });
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ==================== main loop ==================== */
  let last = performance.now();
  function frame(ts){
    const dt = Math.min(3, (ts - last) / 16.667) || 1;
    last = ts;
    time += dt * .016;

    stepFX(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
    positionNameOverlay();
    positionEditOverlay();
    requestAnimationFrame(frame);
  }

  /* ==================== boot ==================== */
  paintMute();
  refreshInfo();
  refreshPanel();
  requestAnimationFrame(frame);
})();
</script>
