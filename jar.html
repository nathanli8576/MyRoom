<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Worry Jar</title>
<meta name="description" content="Seal a worry until a date you choose. When it opens, decide whether it mattered.">
<meta name="theme-color" content="#100e18">
<style>
:root{--bg:#100e18;--ink:#e6e1f2;--mute:#9a90b8;--dim:#6a6280;--line:rgba(190,170,230,.14);--accent:200,180,230;
  --ease:cubic-bezier(.2,.7,.3,1);--t:170ms;
  --surface:rgba(255,255,255,.03);--hairline:rgba(255,255,255,.1);
  --lift:0 1px 2px rgba(0,0,0,.25),0 22px 46px -32px rgba(0,0,0,.85)}
*{box-sizing:border-box}
/* one consistent focus ring for every focusable element */
:focus-visible{outline:2px solid rgba(var(--accent),.9);outline-offset:2px}
button{
  transition:border-color var(--t) var(--ease),background var(--t) var(--ease),
    color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform var(--t) var(--ease);
}
button:active{transform:scale(.97)}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(60% 45% at 50% -8%,rgba(140,110,190,.18),transparent 70%),
    radial-gradient(70% 40% at 50% 108%,rgba(90,70,160,.12),transparent 70%),
    var(--bg);
  color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
  padding:clamp(50px,9vh,80px) 20px 60px;
  min-height:100vh;
}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:5;
  width:36px;height:36px;display:grid;place-items:center;border-radius:999px;
  color:var(--mute);text-decoration:none;border:1px solid var(--hairline);
  background:rgba(255,255,255,.04);box-shadow:0 1px 2px rgba(0,0,0,.3);
  transition:color var(--t) var(--ease),border-color var(--t) var(--ease),
    background var(--t) var(--ease),transform var(--t) var(--ease)}
.back:hover{color:var(--ink);border-color:rgba(var(--accent),.55);background:rgba(var(--accent),.1)}
.back:active{transform:scale(.94)}
header{text-align:center;max-width:560px;margin-bottom:8px}
h1{margin:0;font-weight:300;font-size:clamp(26px,4.5vw,36px);letter-spacing:.14em}
.sub{margin:10px 0 0;color:var(--mute);font-style:italic;font-size:15px;line-height:1.6}

.jar-stage{
  width:min(360px,86vw);
  height:min(52vh,460px);
  margin:22px auto 10px;
  position:relative;
  flex:none;
}
#jar{display:block;width:100%;height:100%;cursor:default;touch-action:manipulation}
#jar.has-ready{cursor:pointer}

.summary{
  margin:6px 0 4px;text-align:center;color:var(--mute);
  font-style:italic;font-size:14px;line-height:1.6;min-height:1.5em;
  font-variant-numeric:tabular-nums;
}
.ready-callout{
  width:min(520px,100%);margin:0 auto 16px;
  display:flex;gap:8px 14px;align-items:center;justify-content:center;flex-wrap:wrap;
  min-height:40px;padding:5px 14px;border-radius:14px;
  border:1px solid rgba(255,216,160,.22);
  background:rgba(255,216,160,.05);
  font-size:14px;line-height:1.5;
  color:#ffd8a0;letter-spacing:.02em;
  opacity:0;transition:opacity .6s var(--ease);
}
.ready-callout.show{opacity:1}
.ready-open{
  padding:8px 18px;border-radius:999px;
  font-size:13px;letter-spacing:.06em;
  color:#ffe9c8;cursor:pointer;
  border:1px solid rgba(255,216,160,.45);
  background:linear-gradient(rgba(255,216,160,.18),rgba(255,216,160,.06));
}
.ready-open:hover{color:#fff8ec;border-color:rgba(255,228,184,.85);box-shadow:0 0 22px rgba(255,216,160,.3)}

.compose{
  width:min(520px,100%);
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:18px;
  padding:20px 22px 18px;
  box-shadow:var(--lift);
  transition:border-color .4s var(--ease),box-shadow .4s var(--ease);
}
.compose:focus-within{border-color:rgba(var(--accent),.35);box-shadow:var(--lift),0 0 40px rgba(var(--accent),.07)}
textarea{
  display:block;width:100%;min-height:100px;padding:12px 14px;resize:none;
  background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);font:300 17px/1.65 inherit;outline:none;
  transition:border-color .4s,box-shadow .4s;
}
textarea::placeholder{color:var(--dim);font-style:italic}
textarea:focus{border-color:rgba(var(--accent),.45);box-shadow:0 0 0 4px rgba(var(--accent),.06)}

.durations{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}
.dur{
  padding:12px 10px 11px;
  border-radius:14px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  color:var(--mute);
  font:inherit;font-size:13px;letter-spacing:.04em;
  cursor:pointer;
  text-align:center;
  transition:border-color var(--t) var(--ease),background var(--t) var(--ease),
    color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform var(--t) var(--ease);
  display:flex;flex-direction:column;gap:4px;align-items:center;
  position:relative;overflow:hidden;
}
.dur .dur-label{
  font-size:13.5px;
  transition:color var(--t) var(--ease);
}
.dur .dur-date{
  font-size:10.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  font-variant-numeric:tabular-nums;
  opacity:.55;
  font-style:italic;
  transition:opacity var(--t) var(--ease),color var(--t) var(--ease);
}
.dur:hover{
  color:var(--ink);
  border-color:rgba(var(--accent),.35);
  background:rgba(var(--accent),.04);
}
.dur[aria-checked="true"]{
  color:#f0eaff;
  border-color:rgba(var(--accent),.7);
  background:linear-gradient(180deg,rgba(var(--accent),.20),rgba(var(--accent),.08));
  box-shadow:0 0 24px rgba(var(--accent),.18),inset 0 0 0 1px rgba(var(--accent),.15);
  transform:translateY(-1px);
}
.dur[aria-checked="true"] .dur-label{
  color:#ffffff;
  text-shadow:0 0 12px rgba(var(--accent),.5);
}
.dur[aria-checked="true"] .dur-date{
  opacity:.85;
  color:#dfd0ff;
}
.dur[aria-checked="true"]::before{
  content:'';
  position:absolute;top:0;left:14%;right:14%;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
}
.dur[aria-checked="true"]::after{
  content:'✓';
  position:absolute;top:6px;right:8px;
  font-size:10px;color:#e5d8ff;opacity:.9;
  text-shadow:0 0 8px rgba(var(--accent),.8);
}
.dur:active{transform:scale(.97)}

.seal-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:14px;margin-top:16px;
}
.opens-on{
  margin:0;color:var(--dim);font-size:12px;letter-spacing:.04em;font-style:italic;line-height:1.5;
  font-variant-numeric:tabular-nums;
  flex:1;
}
.opens-on b{color:var(--mute);font-weight:400;font-style:normal}
.seal{
  font:inherit;cursor:pointer;
  padding:11px 26px;border-radius:999px;
  color:#ebe4ff;font-size:14px;letter-spacing:.08em;
  border:1px solid rgba(var(--accent),.5);
  background:linear-gradient(rgba(var(--accent),.18),rgba(var(--accent),.06));
  transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease),
    transform var(--t) var(--ease),opacity var(--t) var(--ease);
  white-space:nowrap;
}
.seal:hover:not(:disabled){box-shadow:0 0 28px rgba(var(--accent),.35);border-color:rgba(var(--accent),.85)}
.seal:active:not(:disabled){transform:scale(.97)}
.seal:disabled{opacity:.32;cursor:default}

details.log{
  width:min(520px,100%);
  margin-top:28px;
  border-top:1px solid var(--line);
  padding-top:20px;
}
details.log summary{
  cursor:pointer;list-style:none;
  color:var(--mute);font-size:13px;letter-spacing:.08em;
  font-style:italic;padding:6px 0;
  outline:none;
  transition:color var(--t) var(--ease);
}
details.log summary:focus-visible{outline:2px solid rgba(var(--accent),.9);outline-offset:3px;border-radius:6px}
details.log summary::-webkit-details-marker{display:none}
details.log summary::before{content:'▸ ';transition:transform .3s;display:inline-block;margin-right:4px}
details.log[open] summary::before{transform:rotate(90deg);display:inline-block}
details.log summary:hover{color:var(--ink)}
.log-list{display:grid;gap:8px;margin-top:12px}
.log-row{
  display:flex;gap:12px;align-items:flex-start;
  padding:11px 14px;
  background:var(--surface);
  border:1px solid rgba(255,255,255,.08);border-radius:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.22),0 14px 30px -26px rgba(0,0,0,.8);
  font-size:13.5px;line-height:1.55;
  opacity:var(--o,1);
  transition:border-color var(--t) var(--ease),background var(--t) var(--ease),
    box-shadow var(--t) var(--ease);
}
/* ripe / done states — color AND shape, never color alone */
.log-row.is-ready{
  border-color:rgba(255,216,160,.42);
  background:rgba(255,216,160,.055);
  box-shadow:0 1px 2px rgba(0,0,0,.22),0 0 24px -8px rgba(255,216,160,.4);
}
.log-row.is-done{
  border-color:rgba(255,255,255,.06);
  background:rgba(255,255,255,.014);
}
.log-dot{
  width:9px;height:9px;border-radius:50%;
  flex:none;margin-top:5px;
  box-shadow:0 0 8px currentColor;
  color:var(--c,#9a90b8);
  background:var(--c,#9a90b8);
}
.log-row.is-ready .log-dot{border-radius:2px;transform:rotate(45deg);box-shadow:0 0 10px currentColor}
.log-row.is-done .log-dot{background:transparent;border:2px solid currentColor;box-shadow:none;opacity:.85}
.log-body{flex:1;min-width:0;color:var(--ink);word-break:break-word}
.log-meta{color:var(--dim);font-size:11.5px;letter-spacing:.06em;font-style:italic;margin-top:3px;
  font-variant-numeric:tabular-nums}
.log-open{
  flex:none;margin-top:1px;
  padding:6px 14px;border-radius:999px;
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);cursor:pointer;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);
}
.log-open:hover{color:var(--ink);border-color:rgba(var(--accent),.6);background:rgba(var(--accent),.1)}

.resolver{
  position:fixed;inset:0;z-index:8;
  background:rgba(6,4,12,.88);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:40px 20px;
}
.resolver.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.resolver-inner{
  max-width:440px;width:100%;
  background:rgba(20,17,32,.96);
  border:1px solid rgba(255,255,255,.12);border-radius:20px;
  padding:28px 26px 22px;position:relative;
  box-shadow:0 0 0 1px rgba(var(--accent),.16),0 2px 6px rgba(0,0,0,.4),
    0 34px 72px -30px rgba(0,0,0,.95);
}
.resolver-inner:focus{outline:none}
.resolver-inner:focus-visible{outline:2px solid rgba(var(--accent),.9);outline-offset:6px;border-radius:20px}
.resolver-q{margin:0 0 6px;font-size:19px;font-weight:400;color:#efe8ff}
.resolver-date{margin:0 0 18px;color:var(--dim);font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;font-style:italic;font-variant-numeric:tabular-nums}
.resolver-text{
  margin:0 0 22px;padding:14px 16px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  font-size:15px;line-height:1.7;color:var(--ink);white-space:pre-wrap;
}
.resolver-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.resolver-btns button{
  font:inherit;cursor:pointer;
  padding:10px 22px;border-radius:999px;
  font-size:13.5px;letter-spacing:.06em;
}
.resolver-btns .neutral{
  background:none;color:var(--mute);border:1px solid var(--line);
}
.resolver-btns .neutral:hover{color:var(--ink);border-color:rgba(var(--accent),.5)}
.resolver-btns .nothing{
  color:#d6f5e2;border:1px solid rgba(140,220,180,.5);
  background:linear-gradient(rgba(120,200,160,.16),rgba(120,200,160,.05));
}
.resolver-btns .nothing:hover{box-shadow:0 0 24px rgba(140,220,180,.3);border-color:rgba(180,240,210,.85)}
.resolver-btns .true{
  color:#ffd9d9;border:1px solid rgba(220,140,140,.5);
  background:linear-gradient(rgba(220,130,130,.16),rgba(220,130,130,.05));
}
.resolver-btns .true:hover{box-shadow:0 0 24px rgba(220,140,140,.3);border-color:rgba(255,180,180,.85)}
.resolver-close{
  position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:999px;
  display:grid;place-items:center;background:none;border:1px solid rgba(255,255,255,.14);
  color:var(--mute);
  cursor:pointer;font-size:17px;line-height:1;padding:0;
}
.resolver-close:hover{color:var(--ink);border-color:rgba(var(--accent),.55);background:rgba(var(--accent),.08)}

.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(8px);
  padding:9px 20px;border-radius:999px;
  background:rgba(22,18,34,.95);border:1px solid rgba(var(--accent),.35);
  color:#e6e1f2;font-size:13px;letter-spacing:.04em;
  opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;z-index:9;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<a class="back" href="index.html" aria-label="Back to the shelf"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>

<header>
  <h1>The Worry Jar</h1>
  <p class="sub">Seal a worry. It opens on its own.</p>
</header>

<div class="jar-stage">
  <canvas id="jar" aria-hidden="true"></canvas>
</div>

<p class="summary" id="summary">Your jar is empty.</p>
<div class="ready-callout" id="readyCallout">
  <span id="readyText"></span>
  <button type="button" class="ready-open" id="readyOpen" hidden>Open the ripe worry</button>
</div>

<div class="compose">
  <textarea id="worry" maxlength="400" placeholder="What are you worrying about?" aria-label="Your worry"></textarea>
  <div class="durations" role="radiogroup" aria-label="Seal for how long?">
    <button class="dur" type="button" role="radio" aria-checked="true" tabindex="0" data-days="7">
      <span class="dur-label">One week</span>
      <span class="dur-date" data-date></span>
    </button>
    <button class="dur" type="button" role="radio" aria-checked="false" tabindex="-1" data-days="30">
      <span class="dur-label">One month</span>
      <span class="dur-date" data-date></span>
    </button>
    <button class="dur" type="button" role="radio" aria-checked="false" tabindex="-1" data-days="365">
      <span class="dur-label">One year</span>
      <span class="dur-date" data-date></span>
    </button>
  </div>
  <div class="seal-row">
    <p class="opens-on" id="opensOn"></p>
    <button class="seal" id="seal" disabled>Seal it</button>
  </div>
</div>

<details class="log">
  <summary>See all worries</summary>
  <div class="log-list" id="logList"></div>
</details>

<div class="resolver" id="resolver">
  <div class="resolver-inner" id="resolverPanel" role="dialog" aria-modal="true" aria-labelledby="resolverQ" tabindex="-1">
    <button class="resolver-close" id="resolverClose" aria-label="Close">×</button>
    <p class="resolver-q" id="resolverQ">Did it matter?</p>
    <p class="resolver-date" id="resolverDate"></p>
    <p class="resolver-text" id="resolverText"></p>
    <div class="resolver-btns">
      <button class="neutral" id="resolverLater">Ask me later</button>
      <button class="nothing" data-answer="nothing">Not really</button>
      <button class="true" data-answer="true">Still true</button>
    </div>
  </div>
</div>

<p class="toast" id="toast" role="status" aria-live="polite"></p>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const canvas = $('#jar'), ctx = canvas.getContext('2d');
  const worryEl = $('#worry'), sealBtn = $('#seal'), summary = $('#summary'),
        readyCallout = $('#readyCallout'), readyText = $('#readyText'), readyOpen = $('#readyOpen'),
        logList = $('#logList'),
        opensOn = $('#opensOn'), durBtns = [...document.querySelectorAll('.dur')],
        resolver = $('#resolver'), resolverPanel = $('#resolverPanel'),
        resolverText = $('#resolverText'), resolverDate = $('#resolverDate'),
        resolverClose = $('#resolverClose'), resolverLater = $('#resolverLater'),
        toastEl = $('#toast');
  const logSummary = document.querySelector('details.log summary');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const KEY = 'worry-jar:v2';

  /* ---------- state ---------- */
  let worries = [];  // { id, body, at, opensAt, days, outcome, openedAt }
  let orbs = [];     // { worryId, x, y, vx, vy, r, mode:'sealed'|'ready'|'kept', seed, hover }
  let pops = [];     // resolution sparkle particles
  let bubbles = [];  // ambient bubbles

  let selectedDays = 7;
  let jarW=0, jarH=0, jdpr=1;
  let jar = { left: 0, right: 0, top: 0, bottom: 0 };
  let readyOrbId = null;
  let earliestReadyId = null;
  let lastFrame = performance.now();
  let pulsePhase = 0;

  /* ---------- persistence ---------- */
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (Array.isArray(raw)){
      worries = raw.filter(w => w && typeof w.body === 'string' && Number.isFinite(w.opensAt))
        .map(w => ({
          id: w.id || (Date.now() + '-' + Math.random().toString(36).slice(2,7)),
          body: w.body,
          at: w.at || Date.now(),
          opensAt: w.opensAt,
          days: w.days || Math.round((w.opensAt - (w.at||Date.now())) / 86400000) || 30,
          outcome: w.outcome || null,
          openedAt: w.openedAt || null
        }));
    }
  } catch(e){ worries = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(worries)); } catch(e){} };

  /* ---------- date helpers ---------- */
  function fmtFull(ms){ return new Date(ms).toLocaleDateString(undefined,{ year:'numeric', month:'long', day:'numeric' }); }
  function fmtShort(ms){
    const d = new Date(ms), n = new Date();
    return d.toLocaleDateString(undefined,
      d.getFullYear() === n.getFullYear()
        ? { month:'short', day:'numeric' }
        : { month:'short', day:'numeric', year:'numeric' });
  }
  function colorForDays(days){
    // warm pink (short) → lavender (medium) → cool blue (long)
    if (days <= 10) return { r:255, g:170, b:200 };
    if (days <= 45) return { r:200, g:170, b:230 };
    return { r:150, g:180, b:235 };
  }

  /* ---------- toast ---------- */
  let toastT = 0;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  /* ---------- update duration button labels and selection ---------- */
  function updateDurationLabels(){
    const now = Date.now();
    durBtns.forEach(b => {
      const days = Number(b.dataset.days);
      const dateEl = b.querySelector('[data-date]');
      dateEl.textContent = fmtShort(now + days * 86400000);
    });
  }
  function updateOpensOnLine(){
    const now = Date.now();
    const target = now + selectedDays * 86400000;
    const label = selectedDays === 7 ? 'one week' : selectedDays === 30 ? 'one month' : 'one year';
    opensOn.innerHTML = `Seals for <b>${label}</b> · opens <b>${fmtFull(target)}</b>`;
  }

  /* ---------- jar sizing & geometry ---------- */
  function resizeJar(){
    jdpr = Math.min(devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    jarW = Math.round(r.width);
    jarH = Math.round(r.height);
    canvas.width = jarW * jdpr;
    canvas.height = jarH * jdpr;
    ctx.setTransform(jdpr, 0, 0, jdpr, 0, 0);

    // interior bounds — the space orbs are allowed to occupy
    const padX = Math.max(18, jarW * .10);
    const padTop = jarH * .16;
    const padBot = jarH * .06;
    jar.left = padX;
    jar.right = jarW - padX;
    jar.top = padTop;
    jar.bottom = jarH - padBot;

    // rescale orbs proportionally so a resize doesn't shove them out of the jar
    const baseR = Math.max(7, Math.min(jarW, jarH) * .038);
    for (const o of orbs){
      o.r = o.mode === 'kept' ? baseR * 1.05 : baseR;
      o.x = Math.max(jar.left + o.r, Math.min(jar.right - o.r, o.x));
      o.y = Math.max(jar.top + o.r, Math.min(jar.bottom - o.r, o.y));
    }
    spawnOrbsForMissing();
  }

  /* ---------- orb spawning ---------- */
  function spawnOrbsForMissing(){
    const baseR = Math.max(7, Math.min(jarW, jarH) * .038);
    for (const w of worries){
      if (!orbs.find(o => o.worryId === w.id)){
        orbs.push({
          worryId: w.id,
          x: jar.left + baseR + Math.random() * (jar.right - jar.left - baseR * 2),
          y: jar.top + Math.random() * 30,
          vx: 0, vy: 0,
          r: w.outcome ? baseR * 1.05 : baseR,
          mode: w.outcome ? 'kept' : (Date.now() >= w.opensAt ? 'ready' : 'sealed'),
          seed: Math.random() * 6.28,
          hover: 0
        });
      }
    }
    // remove orbs whose worry disappeared
    orbs = orbs.filter(o => worries.some(w => w.id === o.worryId));
  }

  /* ---------- physics ---------- */
  function stepPhysics(dt){
    const g = 0.35;      // gravity
    const damp = 0.94;
    const baseR = Math.max(7, Math.min(jarW, jarH) * .038);

    for (const o of orbs){
      const w = worries.find(x => x.id === o.worryId);
      if (!w) continue;
      // state sync
      const wasOutcome = w.outcome;
      if (wasOutcome){
        o.mode = 'kept';
        o.r = baseR * 1.05;
      } else if (Date.now() >= w.opensAt){
        o.mode = 'ready';
      } else {
        o.mode = 'sealed';
      }

      if (o.mode === 'ready'){
        // ready orbs float upward toward the top of the jar
        // calm (reduced motion): hold a fixed target — no bobbing, no lateral drift
        const bob = calm ? 0 : Math.sin(pulsePhase * .8 + o.seed) * 3;
        const targetY = jar.top + o.r + 6 + bob;
        o.vy += (targetY - o.y) * .008 * dt;
        o.vy *= .88;
        if (!calm) o.vx += Math.sin(pulsePhase * .6 + o.seed) * .015 * dt;
        o.vx *= .92;
      } else {
        o.vy += g * dt;
        o.vx *= Math.pow(damp, dt);
        o.vy *= Math.pow(damp, dt);
      }
      o.x += o.vx * dt;
      o.y += o.vy * dt;

      // walls & floor (ready orbs get a wider float range)
      const l = jar.left + o.r, r = jar.right - o.r;
      if (o.x < l){ o.x = l; o.vx = Math.abs(o.vx) * .3; }
      if (o.x > r){ o.x = r; o.vx = -Math.abs(o.vx) * .3; }
      if (o.y < jar.top + o.r){ o.y = jar.top + o.r; o.vy = Math.abs(o.vy) * .2; }
      if (o.mode !== 'ready' && o.y > jar.bottom - o.r){
        o.y = jar.bottom - o.r;
        if (o.vy > 0) o.vy *= -.18;
        o.vx *= .86;
      }
    }

    // orb-orb collision — skip anything in ready mode (they pass through)
    for (let i = 0; i < orbs.length; i++){
      const a = orbs[i];
      if (a.mode === 'ready') continue;
      for (let j = i + 1; j < orbs.length; j++){
        const b = orbs[j];
        if (b.mode === 'ready') continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx*dx + dy*dy;
        const minD = a.r + b.r;
        if (d2 < minD * minD && d2 > 0.0001){
          const d = Math.sqrt(d2);
          const overlap = (minD - d) * .5;
          const nx = dx / d, ny = dy / d;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          // gentle velocity transfer
          const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0){
            const imp = rel * .5;
            a.vx += nx * imp; a.vy += ny * imp;
            b.vx -= nx * imp; b.vy -= ny * imp;
          }
        }
      }
    }
  }

  /* ---------- pops & bubbles ---------- */
  function popAt(x, y, color){
    const n = calm ? 10 : 28;          // smaller, faster burst under reduced motion
    const decayBase = calm ? .03 : .012;
    for (let i = 0; i < n; i++){
      const a = Math.random() * 6.28;
      const sp = .8 + Math.random() * 2.6;
      pops.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - .6,
        life: 1, decay: decayBase + Math.random() * .008,
        color, seed: Math.random() * 6.28,
        size: 1 + Math.random() * 2
      });
    }
  }
  function stepFX(dt){
    for (let i = pops.length - 1; i >= 0; i--){
      const p = pops[i];
      p.life -= p.decay * dt;
      if (p.life <= 0){ pops.splice(i,1); continue; }
      p.vy -= .02 * dt;
      p.vx *= .96; p.vy *= .96;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    // ambient bubbles
    if (!calm && Math.random() < .012 * dt && bubbles.length < 10){
      bubbles.push({
        x: jar.left + Math.random() * (jar.right - jar.left),
        y: jar.bottom,
        r: .8 + Math.random() * 1.6,
        vy: -.15 - Math.random() * .25,
        life: 1, seed: Math.random() * 6.28
      });
    }
    for (let i = bubbles.length - 1; i >= 0; i--){
      const b = bubbles[i];
      b.y += b.vy * dt;
      b.x += Math.sin(pulsePhase + b.seed) * .2 * dt;
      b.life -= .004 * dt;
      if (b.life <= 0 || b.y < jar.top) bubbles.splice(i,1);
    }
  }

  /* ---------- rendering ---------- */
  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function drawJar(ts){
    ctx.setTransform(jdpr, 0, 0, jdpr, 0, 0);
    ctx.clearRect(0, 0, jarW, jarH);

    // jar outer dims (slightly larger than interior bounds)
    const jx = jar.left - 10;
    const jy = jar.top - 14;
    const jw = (jar.right - jar.left) + 20;
    const jh = (jar.bottom - jar.top) + 18;
    const jr = Math.min(28, jw * .12);

    // ambient glow behind the jar, growing with worry count
    const count = worries.length;
    const glowStrength = Math.min(1, count / 12);
    if (count > 0 || orbs.length){
      const ag = ctx.createRadialGradient(jarW/2, jarH*.6, 0, jarW/2, jarH*.6, jarW * .9);
      ag.addColorStop(0, `rgba(200,170,240,${.08 + .10 * glowStrength})`);
      ag.addColorStop(1, 'rgba(200,170,240,0)');
      ctx.fillStyle = ag;
      ctx.fillRect(0, 0, jarW, jarH);
    }

    // glass body — filled with a subtle vertical gradient
    const glassFill = ctx.createLinearGradient(jx, jy, jx, jy + jh);
    glassFill.addColorStop(0,   'rgba(150,170,210,.14)');
    glassFill.addColorStop(.4,  'rgba(130,150,200,.08)');
    glassFill.addColorStop(.85, 'rgba(120,140,190,.10)');
    glassFill.addColorStop(1,   'rgba(150,170,210,.18)');
    roundRect(ctx, jx, jy, jw, jh, jr);
    ctx.fillStyle = glassFill;
    ctx.fill();

    // interior shadow at edges — depth
    ctx.save();
    roundRect(ctx, jx, jy, jw, jh, jr);
    ctx.clip();
    const edgeShadow = ctx.createLinearGradient(jx, 0, jx + jw, 0);
    edgeShadow.addColorStop(0, 'rgba(0,0,0,.22)');
    edgeShadow.addColorStop(.15, 'rgba(0,0,0,0)');
    edgeShadow.addColorStop(.85, 'rgba(0,0,0,0)');
    edgeShadow.addColorStop(1, 'rgba(0,0,0,.22)');
    ctx.fillStyle = edgeShadow;
    ctx.fillRect(jx, jy, jw, jh);
    ctx.restore();

    // clip to interior for orbs and bubbles
    ctx.save();
    roundRect(ctx, jx + 3, jy + 3, jw - 6, jh - 6, jr - 3);
    ctx.clip();

    // ambient bubbles (behind orbs)
    for (const b of bubbles){
      ctx.globalAlpha = b.life * .35;
      ctx.fillStyle = 'rgba(220,225,255,.6)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 6.28);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // orbs
    for (const o of orbs){
      const w = worries.find(x => x.id === o.worryId);
      if (!w) continue;
      drawOrb(o, w, ts);
    }

    // pop sparkles (in front of orbs)
    ctx.globalCompositeOperation = 'lighter';
    for (const p of pops){
      const a = p.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = `rgb(${p.color.r},${p.color.g},${p.color.b})`;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 5);
      gg.addColorStop(0, `rgba(${p.color.r},${p.color.g},${p.color.b},${a * .6})`);
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(p.x - p.size*5, p.y - p.size*5, p.size*10, p.size*10);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    ctx.restore();  // end interior clip

    // glass highlights — diagonal stripe
    ctx.save();
    roundRect(ctx, jx, jy, jw, jh, jr);
    ctx.clip();
    const stripe = ctx.createLinearGradient(jx, jy, jx + jw, jy + jh);
    stripe.addColorStop(0,   'rgba(255,255,255,.06)');
    stripe.addColorStop(.28, 'rgba(255,255,255,.13)');
    stripe.addColorStop(.35, 'rgba(255,255,255,0)');
    stripe.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = stripe;
    ctx.fillRect(jx, jy, jw, jh);
    ctx.restore();

    // glass rim (thick border)
    roundRect(ctx, jx, jy, jw, jh, jr);
    ctx.strokeStyle = 'rgba(200,215,245,.35)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // inner rim (double-line for glass thickness)
    roundRect(ctx, jx + 3, jy + 3, jw - 6, jh - 6, jr - 3);
    ctx.strokeStyle = 'rgba(180,200,235,.15)';
    ctx.lineWidth = .8;
    ctx.stroke();

    // lid — a small slab sitting on top of the jar
    const lidW = jw * .68, lidH = 12;
    const lidX = jx + (jw - lidW)/2, lidY = jy - lidH + 3;
    const lidGrad = ctx.createLinearGradient(lidX, lidY, lidX, lidY + lidH);
    lidGrad.addColorStop(0, 'rgba(170,150,200,.85)');
    lidGrad.addColorStop(.5, 'rgba(110,90,140,.9)');
    lidGrad.addColorStop(1, 'rgba(80,60,105,.9)');
    roundRect(ctx, lidX, lidY, lidW, lidH, 5);
    ctx.fillStyle = lidGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(220,205,245,.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // lid knob
    ctx.beginPath();
    ctx.arc(jx + jw/2, lidY - 2, 5, 0, 6.28);
    ctx.fillStyle = 'rgba(140,120,175,.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(220,205,245,.5)';
    ctx.lineWidth = .8;
    ctx.stroke();
  }

  function drawOrb(o, w, ts){
    const days = w.days || 30;
    const col = colorForDays(days);
    const isKept = o.mode === 'kept';
    const isReady = o.mode === 'ready';
    // under reduced motion all phase-driven animation is frozen: static glow,
    // static rim, seeds and sparks parked at fixed angles
    const ph = calm ? 0 : pulsePhase;

    let baseCol = isKept
      ? { r:110, g:100, b:130 }
      : isReady
        ? { r:255, g:225, b:150 }
        : col;

    // soft glow behind the orb
    const glowR = o.r * (isReady ? 2.4 + Math.sin(ph * 2 + o.seed) * .5 : 1.7);
    const grd = ctx.createRadialGradient(o.x, o.y, o.r * .3, o.x, o.y, glowR);
    if (isReady){
      const pulse = .55 + .35 * Math.sin(ph * 2 + o.seed);
      grd.addColorStop(0, `rgba(255,235,180,${.55 * pulse})`);
      grd.addColorStop(.5, `rgba(255,200,120,${.22 * pulse})`);
      grd.addColorStop(1, 'rgba(255,200,120,0)');
    } else if (isKept){
      grd.addColorStop(0, 'rgba(150,140,170,.18)');
      grd.addColorStop(1, 'rgba(150,140,170,0)');
    } else {
      grd.addColorStop(0, `rgba(${baseCol.r},${baseCol.g},${baseCol.b},.42)`);
      grd.addColorStop(1, `rgba(${baseCol.r},${baseCol.g},${baseCol.b},0)`);
    }
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(o.x, o.y, glowR, 0, 6.28);
    ctx.fill();

    // orb body — radial gradient for a subtle 3d feel
    const bodyGrad = ctx.createRadialGradient(
      o.x - o.r * .35, o.y - o.r * .4, o.r * .1,
      o.x, o.y, o.r
    );
    if (isKept){
      bodyGrad.addColorStop(0, 'rgba(160,150,180,.85)');
      bodyGrad.addColorStop(.7, 'rgba(90,80,110,.9)');
      bodyGrad.addColorStop(1, 'rgba(60,50,80,.95)');
    } else if (isReady){
      bodyGrad.addColorStop(0, 'rgba(255,250,220,1)');
      bodyGrad.addColorStop(.5, 'rgba(255,215,140,.98)');
      bodyGrad.addColorStop(1, 'rgba(230,150,60,.95)');
    } else {
      bodyGrad.addColorStop(0, `rgba(255,255,255,${.55 * (baseCol.r>200?1:.85)})`);
      bodyGrad.addColorStop(.35, `rgba(${baseCol.r},${baseCol.g},${baseCol.b},.92)`);
      bodyGrad.addColorStop(1, `rgba(${Math.max(40,baseCol.r-70)},${Math.max(30,baseCol.g-70)},${Math.max(50,baseCol.b-60)},.95)`);
    }
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, 6.28);
    ctx.fillStyle = bodyGrad;
    ctx.fill();

    // rim light
    ctx.strokeStyle = isReady
      ? `rgba(255,240,200,${.7 + .3 * Math.sin(ph * 2 + o.seed)})`
      : isKept
        ? 'rgba(180,170,200,.35)'
        : `rgba(${Math.min(255,baseCol.r+40)},${Math.min(255,baseCol.g+40)},${Math.min(255,baseCol.b+40)},.55)`;
    ctx.lineWidth = isReady ? 1.6 : 1;
    ctx.stroke();

    // specular highlight
    if (!isKept){
      ctx.beginPath();
      ctx.arc(o.x - o.r * .35, o.y - o.r * .42, o.r * .22, 0, 6.28);
      ctx.fillStyle = `rgba(255,255,255,${isReady ? .9 : .55})`;
      ctx.fill();
    }

    // tiny seeds inside the orb — gives it character
    const seedN = isKept ? 1 : 3;
    for (let i = 0; i < seedN; i++){
      const a = o.seed + i * 2.1 + ph * .2;
      const rr = o.r * .35;
      ctx.beginPath();
      ctx.arc(
        o.x + Math.cos(a) * rr,
        o.y + Math.sin(a) * rr * .7,
        o.r * .08 + .5,
        0, 6.28
      );
      ctx.fillStyle = isKept ? 'rgba(200,190,220,.35)' : 'rgba(255,255,255,.4)';
      ctx.fill();
    }

    // ready badge — an orbiting spark (parked at fixed angles under calm)
    if (isReady){
      for (let i = 0; i < 3; i++){
        const a = ph * 1.2 + i * 2.09 + o.seed;
        const rr = o.r * 1.35;
        ctx.beginPath();
        ctx.arc(o.x + Math.cos(a) * rr, o.y + Math.sin(a) * rr, 1.6, 0, 6.28);
        ctx.fillStyle = `rgba(255,240,180,${.65 + .35 * Math.sin(ph * 3 + i)})`;
        ctx.fill();
      }
    }
  }

  /* ---------- main loop ---------- */
  function frame(ts){
    const dtReal = Math.min(3, (ts - lastFrame) / 16.667) || 1;
    lastFrame = ts;
    if (!calm) pulsePhase += dtReal * .05;
    const dt = dtReal;

    stepPhysics(dt);
    stepFX(dt);
    drawJar(ts);

    requestAnimationFrame(frame);
  }

  /* ---------- hit testing on the jar canvas ---------- */
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let hoverId = null;
    for (const o of orbs){
      if (o.mode !== 'ready') continue;
      if (Math.hypot(mx - o.x, my - o.y) < o.r + 8){ hoverId = o.worryId; break; }
    }
    canvas.classList.toggle('has-ready', hoverId != null);
  });
  canvas.addEventListener('pointerleave', () => canvas.classList.remove('has-ready'));
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    for (const o of orbs){
      if (o.mode !== 'ready') continue;
      if (Math.hypot(mx - o.x, my - o.y) < o.r + 8){
        openResolver(o.worryId);
        return;
      }
    }
  });

  /* ---------- summary + log ---------- */
  function refreshSummary(){
    const sealed = worries.filter(w => !w.outcome).length;
    const readyWorries = worries.filter(w => !w.outcome && Date.now() >= w.opensAt)
      .sort((a, b) => a.opensAt - b.opensAt);
    const ready = readyWorries.length;
    const kept = worries.filter(w => w.outcome === 'true').length;
    const cleared = worries.filter(w => w.outcome === 'nothing').length;

    if (worries.length === 0){
      summary.textContent = 'Your jar is empty.';
    } else {
      const parts = [];
      if (sealed) parts.push(`${sealed} sealed`);
      if (kept) parts.push(`${kept} still true`);
      if (cleared) parts.push(`${cleared} let go`);
      summary.textContent = parts.join(' · ');
    }
    if (ready > 0){
      readyText.textContent = ready === 1
        ? 'One worry is ready — look for the glowing orb.'
        : `${ready} worries are ready — look for the glowing orbs.`;
      readyOpen.textContent = ready === 1 ? 'Open the ripe worry' : 'Open a ripe worry';
      earliestReadyId = readyWorries[0].id;
      readyOpen.hidden = false;
      readyCallout.classList.add('show');
    } else {
      earliestReadyId = null;
      readyOpen.hidden = true;
      readyCallout.classList.remove('show');
    }
  }
  readyOpen.addEventListener('click', () => {
    if (earliestReadyId) openResolver(earliestReadyId);
  });

  function refreshLog(){
    if (!worries.length){
      logList.innerHTML = '<p style="color:var(--dim);font-size:13px;font-style:italic;margin:0">Nothing sealed yet.</p>';
      return;
    }
    const sorted = worries.slice().sort((a,b) => a.opensAt - b.opensAt);
    logList.innerHTML = sorted.map(w => {
      const isKept = w.outcome === 'true';
      const isCleared = w.outcome === 'nothing';
      const isReady = !w.outcome && Date.now() >= w.opensAt;
      const col = isCleared ? {r:140,g:160,b:150}
                : isKept ? {r:180,g:140,b:140}
                : isReady ? {r:255,g:220,b:140}
                : colorForDays(w.days);
      const meta = isCleared
        ? `opened ${fmtShort(w.openedAt)} · didn't matter`
        : isKept
          ? `opened ${fmtShort(w.openedAt)} · still true`
          : isReady
            ? `ready to open`
            : `sealed until ${fmtShort(w.opensAt)}`;
      const opacity = (isCleared || isKept) ? .55 : 1;
      const stateClass = isReady ? ' is-ready' : (isCleared || isKept) ? ' is-done' : '';
      const label = w.body.length > 48 ? w.body.slice(0, 48) + '…' : w.body;
      const openBtn = isReady
        ? `<button type="button" class="log-open" data-open="${escapeHtml(w.id)}" aria-label="Open ripe worry: ${escapeHtml(label)}">Open</button>`
        : '';
      return `<div class="log-row${stateClass}" style="--o:${opacity}; --c:rgb(${col.r},${col.g},${col.b})">
        <span class="log-dot" aria-hidden="true"></span>
        <div style="flex:1;min-width:0">
          <div class="log-body">${escapeHtml(w.body)}</div>
          <div class="log-meta">${meta}</div>
        </div>
        ${openBtn}
      </div>`;
    }).join('');
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

  // delegated: Open buttons inside re-rendered log rows
  logList.addEventListener('click', e => {
    const btn = e.target.closest('[data-open]');
    if (btn) openResolver(btn.getAttribute('data-open'));
  });

  /* ---------- resolver ---------- */
  let resolverWorryId = null;
  let resolverReturnFocus = null;
  // everything behind the overlay goes inert while the dialog is open
  const bgNodes = [...document.body.children].filter(el => el !== resolver && el !== toastEl);
  function setBackgroundInert(on){
    for (const el of bgNodes){
      if (on) el.setAttribute('inert', '');
      else el.removeAttribute('inert');
    }
  }
  function openResolver(id){
    const w = worries.find(x => x.id === id);
    if (!w || w.outcome) return;
    if (Date.now() < w.opensAt) return;
    resolverWorryId = id;
    resolverText.textContent = w.body;
    resolverDate.textContent = `Sealed ${fmtShort(w.at)} · opened today`;
    resolverReturnFocus = document.activeElement;
    resolver.classList.add('show');
    setBackgroundInert(true);
    resolverPanel.focus({ preventScroll: true });
  }
  function focusEl(el){
    if (!el || typeof el.focus !== 'function') return false;
    if (el.disabled || !document.contains(el)) return false;
    try { el.focus({ preventScroll: true }); return true; } catch(e){ return false; }
  }
  function closeResolver(){
    if (!resolver.classList.contains('show')){ resolverWorryId = null; return; }
    resolver.classList.remove('show');
    resolverWorryId = null;
    setBackgroundInert(false);
    const target = resolverReturnFocus;
    resolverReturnFocus = null;
    // defer: resolve() re-renders the log right after closing, so let that settle
    setTimeout(() => {
      if (focusEl(target)) return;
      if (!readyOpen.hidden && focusEl(readyOpen)) return;
      focusEl(logSummary);
    }, 0);
  }
  resolverClose.addEventListener('click', closeResolver);
  resolverLater.addEventListener('click', closeResolver);
  resolver.addEventListener('click', e => { if (e.target === resolver) closeResolver(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && resolver.classList.contains('show')) closeResolver(); });
  // keep Tab inside the dialog while it is modal (background is inert)
  resolver.addEventListener('keydown', e => {
    if (e.key !== 'Tab' || !resolver.classList.contains('show')) return;
    const focusables = [...resolver.querySelectorAll('button')];
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === resolverPanel)){
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last){
      e.preventDefault(); first.focus();
    }
  });
  resolver.querySelectorAll('[data-answer]').forEach(b => {
    b.addEventListener('click', () => resolve(resolverWorryId, b.dataset.answer));
  });

  function resolve(id, outcome){
    const w = worries.find(x => x.id === id);
    if (!w || w.outcome) return;
    w.outcome = outcome;
    w.openedAt = Date.now();

    // visual: pop the orb if 'nothing', keep it if 'true'
    const o = orbs.find(x => x.worryId === id);
    if (o && outcome === 'nothing'){
      popAt(o.x, o.y, {r:180, g:240, b:200});
      orbs = orbs.filter(x => x.worryId !== id);
      toast('One less thing.');
    } else if (o){
      toast('Still true. That\'s okay too.');
    }

    save();
    closeResolver();
    refreshSummary();
    refreshLog();
  }

  /* ---------- compose ---------- */
  function sealWorry(){
    const text = worryEl.value.trim();
    if (!text) return;
    const now = Date.now();
    const w = {
      id: now + '-' + Math.random().toString(36).slice(2,7),
      body: text,
      at: now,
      opensAt: now + selectedDays * 86400000,
      days: selectedDays,
      outcome: null,
      openedAt: null
    };
    worries.push(w);
    save();

    // drop the new orb from the top of the jar
    const baseR = Math.max(7, Math.min(jarW, jarH) * .038);
    orbs.push({
      worryId: w.id,
      x: jar.left + baseR + Math.random() * (jar.right - jar.left - baseR * 2),
      y: jar.top - 30,
      vx: 0, vy: 2,
      r: baseR,
      mode: 'sealed',
      seed: Math.random() * 6.28,
      hover: 0
    });

    worryEl.value = '';
    sealBtn.disabled = true;
    const label = selectedDays === 7 ? 'a week' : selectedDays === 30 ? 'a month' : 'a year';
    toast(`Sealed for ${label}.`);
    refreshSummary();
    refreshLog();
  }
  sealBtn.addEventListener('click', sealWorry);
  worryEl.addEventListener('input', () => { sealBtn.disabled = !worryEl.value.trim(); });
  worryEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sealWorry();
  });

  function syncDurTabs(){
    // roving tabindex: only the checked radio is a Tab stop
    durBtns.forEach(x => { x.tabIndex = x.getAttribute('aria-checked') === 'true' ? 0 : -1; });
  }
  durBtns.forEach(b => {
    b.addEventListener('click', () => {
      selectedDays = Number(b.dataset.days);
      durBtns.forEach(x => x.setAttribute('aria-checked', x === b));
      syncDurTabs();
      updateOpensOnLine();
    });
    b.addEventListener('keydown', e => {
      const i = durBtns.indexOf(b);
      let ni = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') ni = (i + 1) % durBtns.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ni = (i - 1 + durBtns.length) % durBtns.length;
      if (ni >= 0){
        e.preventDefault();
        durBtns[ni].click();
        durBtns[ni].focus();
      }
    });
  });

  /* ---------- boot ---------- */
  let booted = false;
  function boot(){
    if (booted) return;   // idempotent: DOMContentLoaded path and load path may both fire
    booted = true;
    resizeJar();
    updateDurationLabels();
    updateOpensOnLine();
    syncDurTabs();
    refreshSummary();
    refreshLog();
    requestAnimationFrame(frame);   // the one and only rAF chain
  }
  addEventListener('resize', () => {
    resizeJar();
    updateDurationLabels();
    updateOpensOnLine();
  });
  window.addEventListener('load', boot);
  if (document.readyState === 'complete' || document.readyState === 'interactive'){
    // small delay to let fonts settle so canvas measures correctly
    setTimeout(boot, 30);
  } else {
    document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 30));
  }
})();
</script>
</body>
</html>
