<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will This Matter?</title>
<meta name="description" content="Predict. Wait. Check. Learn how your worries actually age.">
<meta name="theme-color" content="#0e1410">
<style>
:root{--ink:#e0ece6;--mute:#8aa096;--dim:#5e7068;--line:rgba(180,220,200,.16);--accent:150,200,180}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(60% 45% at 50% -8%,rgba(80,150,120,.14),transparent 70%),
    radial-gradient(70% 40% at 50% 108%,rgba(60,120,100,.08),transparent 70%),
    #0e1410;
  color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;height:100%;
}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;z-index:5;
  width:36px;height:36px;display:grid;place-items:center;border-radius:999px;
  color:var(--mute);text-decoration:none;border:1px solid var(--line);
  background:rgba(14,20,16,.55);backdrop-filter:blur(8px);
  transition:color .3s,border-color .3s,background .3s}
.back:hover{color:var(--ink);border-color:rgba(var(--accent),.5);background:rgba(var(--accent),.1)}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:5;
  width:36px;height:36px;display:grid;place-items:center;border-radius:999px;
  color:var(--mute);border:1px solid var(--line);padding:0;margin:0;cursor:pointer;
  background:rgba(14,20,16,.55);backdrop-filter:blur(8px);
  transition:color .3s,border-color .3s,background .3s}
.mute:hover{color:var(--ink);border-color:rgba(var(--accent),.5);background:rgba(var(--accent),.1)}
.mute svg{width:16px;height:16px}
.mute .m{display:block}.mute .x{display:none}
.mute.off .m{display:none}.mute.off .x{display:block}

/* scrollable main column */
.page{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:clamp(60px,10vh,90px) 20px 60px;
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}
.wrap{width:min(640px,100%);position:relative}

h1{margin:0;font-weight:300;font-size:clamp(26px,4.5vw,34px);letter-spacing:.14em;text-align:center}
.sub{margin:10px 0 0;color:var(--mute);font-style:italic;font-size:14.5px;text-align:center;line-height:1.6}

/* phase containers */
.phase{opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s ease;
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:34px}
.phase.show{opacity:1;pointer-events:auto;position:relative}

/* ============ compose ============ */
.compose{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
textarea{
  width:100%;
  min-height:110px;padding:16px 18px;resize:none;
  background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;
  color:var(--ink);font:300 18px/1.65 inherit;outline:none;
  transition:border-color .4s,box-shadow .4s;
}
textarea::placeholder{color:var(--dim);font-style:italic}
textarea:focus{border-color:rgba(var(--accent),.45);box-shadow:0 0 0 4px rgba(var(--accent),.06)}
.begin{
  font:inherit;cursor:pointer;
  padding:11px 30px;border-radius:999px;
  color:#e0f5ea;font-size:14.5px;letter-spacing:.08em;
  border:1px solid rgba(var(--accent),.45);
  background:linear-gradient(rgba(var(--accent),.18),rgba(var(--accent),.06));
  transition:box-shadow .4s,border-color .4s,transform .2s,opacity .4s;
}
.begin:hover:not(:disabled){box-shadow:0 0 28px rgba(var(--accent),.35);border-color:rgba(var(--accent),.75)}
.begin:active:not(:disabled){transform:scale(.98)}
.begin:disabled{opacity:.35;cursor:default}

/* ============ prediction ============ */
.worry-display{
  width:100%;
  padding:26px 24px;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  border-radius:18px;
  text-align:center;
  font-size:clamp(17px,2.6vw,20px);
  line-height:1.55;
  word-break:break-word;
  min-height:110px;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .9s cubic-bezier(.2,.7,.3,1),
             filter .9s cubic-bezier(.2,.7,.3,1),
             transform .9s cubic-bezier(.2,.7,.3,1);
}
.q-block{
  margin-top:34px;width:100%;text-align:center;
  min-height:150px;
  display:flex;flex-direction:column;justify-content:flex-start;
}
.q-text{
  margin:0;font-size:clamp(17px,2.4vw,20px);
  letter-spacing:.02em;
  opacity:0;transform:translateY(6px);
  transition:opacity .5s ease,transform .5s ease;
}
.q-block.on .q-text{opacity:1;transform:translateY(0)}
.q-hint{
  margin:6px 0 26px;color:var(--dim);font-style:italic;font-size:13px;letter-spacing:.03em;
  opacity:0;transition:opacity .5s ease .1s;
}
.q-block.on .q-hint{opacity:1}
.q-answers{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  opacity:0;transform:translateY(6px);
  transition:opacity .5s ease .15s,transform .5s ease .15s;
}
.q-block.on .q-answers{opacity:1;transform:translateY(0)}
.ans{
  font:inherit;cursor:pointer;
  padding:10px 22px;border-radius:999px;
  color:var(--mute);font-size:14px;letter-spacing:.06em;
  border:1px solid var(--line);
  background:rgba(255,255,255,.02);
  transition:all .28s ease;
  min-width:88px;
}
.ans:hover{color:var(--ink);border-color:rgba(var(--accent),.55);background:rgba(var(--accent),.08)}
.ans.picked{
  color:#eaf7ee;
  border-color:rgba(var(--accent),.75);
  background:linear-gradient(rgba(var(--accent),.2),rgba(var(--accent),.08));
  box-shadow:0 0 22px rgba(var(--accent),.28);
}

/* ============ result ============ */
.result{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.chart-box{
  width:100%;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px 22px 14px;
}
#chart{display:block;width:100%;height:220px}
.legend{
  display:flex;gap:22px;justify-content:center;
  margin-top:8px;font-size:11.5px;letter-spacing:.06em;
  color:var(--dim);font-style:italic;
}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:6px}
.legend .yours{background:#8ad0b0}
.legend .typical{background:rgba(180,220,200,.35)}
.verdict{
  margin:0;text-align:center;font-size:15.5px;line-height:1.65;
  color:var(--mute);font-style:italic;
  max-width:520px;
}
.verdict b{color:var(--ink);font-style:normal;font-weight:400}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{
  font:inherit;cursor:pointer;
  padding:10px 24px;border-radius:999px;
  font-size:14px;letter-spacing:.06em;
  transition:all .3s ease;
}
.btn.primary{
  color:#eaf7ee;border:1px solid rgba(var(--accent),.55);
  background:linear-gradient(rgba(var(--accent),.2),rgba(var(--accent),.08));
}
.btn.primary:hover{box-shadow:0 0 26px rgba(var(--accent),.35);border-color:rgba(var(--accent),.85)}
.btn.ghost{
  color:var(--mute);background:none;border:1px solid var(--line);
}
.btn.ghost:hover{color:var(--ink);border-color:rgba(var(--accent),.4)}

/* ============ check-in banner ============ */
.banner{
  width:100%;margin-bottom:22px;padding:14px 18px;
  background:linear-gradient(rgba(var(--accent),.1),rgba(var(--accent),.03));
  border:1px solid rgba(var(--accent),.4);
  border-radius:14px;
  display:none;
  align-items:center;gap:12px;justify-content:space-between;
}
.banner.show{display:flex;animation:fadeUp .6s ease}
.banner p{margin:0;font-size:14px;font-style:italic;color:var(--ink);line-height:1.5}
.banner button{
  font:inherit;cursor:pointer;
  padding:8px 18px;border-radius:999px;
  font-size:12.5px;letter-spacing:.06em;
  color:#eaf7ee;border:1px solid rgba(var(--accent),.55);
  background:rgba(var(--accent),.16);
  white-space:nowrap;
  transition:background .3s,border-color .3s;
}
.banner button:hover{background:rgba(var(--accent),.28);border-color:rgba(var(--accent),.85)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ============ shelf ============ */
.shelf{
  width:100%;margin-top:52px;
  border-top:1px solid var(--line);
  padding-top:26px;
}
.shelf-title{
  margin:0 0 16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);font-weight:400;font-style:italic;
  display:flex;justify-content:space-between;align-items:baseline;
}
.shelf-title span{font-style:normal;letter-spacing:.04em;color:var(--dim);font-size:11.5px}
.shelf-list{display:flex;flex-direction:column;gap:10px}
.shelf-empty{
  padding:30px 20px;text-align:center;color:var(--dim);
  font-style:italic;font-size:14px;
}
.card{
  padding:14px 16px;
  background:rgba(255,255,255,.022);
  border:1px solid var(--line);border-radius:12px;
  cursor:pointer;
  transition:background .3s,border-color .3s,transform .2s;
  position:relative;
}
.card:hover{background:rgba(255,255,255,.04);border-color:rgba(var(--accent),.35)}
.card.due{border-color:rgba(255,200,120,.55);
  background:linear-gradient(rgba(255,200,120,.06),rgba(255,200,120,.02));
  animation:cardGlow 3s ease-in-out infinite}
@keyframes cardGlow{
  0%,100%{box-shadow:0 0 0 rgba(255,200,120,0)}
  50%{box-shadow:0 0 22px rgba(255,200,120,.28)}
}
.card.resolved{opacity:.6}
.card-text{
  margin:0 0 8px;font-size:14.5px;line-height:1.5;color:var(--ink);
  word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-meta{
  margin:0;font-size:11px;letter-spacing:.06em;color:var(--dim);
  font-style:italic;text-transform:uppercase;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.card-meta em{color:var(--mute);font-style:italic;text-transform:none;letter-spacing:.02em;font-size:11.5px}
.card-badge{
  display:inline-block;padding:1px 8px;border-radius:999px;
  background:rgba(255,200,120,.18);color:#ffd9a0;
  font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  margin-left:6px;
}

/* ============ check-in modal ============ */
.modal{
  position:fixed;inset:0;z-index:8;
  background:rgba(4,8,6,.9);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:40px 20px;
}
.modal.show{display:flex;animation:fadeUp .35s ease}
.modal-inner{
  max-width:520px;width:100%;
  background:rgba(18,24,20,.96);
  border:1px solid rgba(var(--accent),.3);border-radius:18px;
  padding:28px 26px 22px;position:relative;
}
.modal h3{margin:0 0 4px;font-weight:400;font-size:19px;color:#eaf7ee}
.modal .date{margin:0 0 18px;color:var(--dim);font-size:12px;letter-spacing:.08em;font-style:italic}
.modal .prior{
  margin:0 0 14px;padding:14px 16px;border-radius:12px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  font-size:15px;line-height:1.65;color:var(--ink);white-space:pre-wrap;
}
.modal .predline{
  margin:0 0 22px;color:var(--dim);font-size:12.5px;line-height:1.7;font-style:italic;
}
.modal .predline b{color:var(--mute);font-weight:400;font-style:normal}
.modal .q{margin:0 0 14px;font-size:15px;font-style:italic;color:var(--mute)}
.modal .answers{display:flex;gap:10px;flex-wrap:wrap}
.modal .answers button{
  font:inherit;cursor:pointer;
  padding:10px 20px;border-radius:999px;
  font-size:14px;letter-spacing:.06em;
  color:var(--mute);border:1px solid var(--line);background:rgba(255,255,255,.02);
  transition:all .28s;
}
.modal .answers button:hover{color:var(--ink);border-color:rgba(var(--accent),.55);background:rgba(var(--accent),.08)}
.modal .close{
  position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:999px;
  display:grid;place-items:center;background:none;border:1px solid var(--line);
  color:var(--mute);cursor:pointer;font-size:17px;line-height:1;padding:0;
  transition:color .3s,border-color .3s;
}
.modal .close:hover{color:var(--ink);border-color:rgba(var(--accent),.5)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<a class="back" href="index.html" aria-label="Back to the shelf"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
<button class="mute" id="mute" aria-label="Mute sound" aria-pressed="false">
  <svg class="m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>
    <path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>
  </svg>
  <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>
    <path d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<div class="page">
  <div class="wrap">
    <h1>Will This Matter?</h1>
    <p class="sub">Predict how your worry will age. Then, when the date arrives, find out if you were right.</p>

    <div class="banner" id="banner">
      <p id="bannerText"></p>
      <button id="bannerGo">Look at it</button>
    </div>

    <!-- Phase 1: compose -->
    <div class="phase show" id="phaseCompose">
      <div class="compose">
        <textarea id="worryText" maxlength="400" placeholder="What's weighing on you right now?"></textarea>
        <button class="begin" id="beginBtn" disabled>Make a prediction →</button>
      </div>

      <div class="shelf" id="shelf">
        <h2 class="shelf-title"><span id="shelfLabel">Your predictions</span><span id="shelfStats"></span></h2>
        <div class="shelf-list" id="shelfList"></div>
      </div>
    </div>

    <!-- Phase 2: predictions -->
    <div class="phase" id="phasePredict">
      <div class="worry-display" id="worryDisplay"></div>
      <div class="q-block" id="qBlock">
        <p class="q-text" id="qText"></p>
        <p class="q-hint" id="qHint">— answer honestly —</p>
        <div class="q-answers">
          <button class="ans" data-ans="yes">Yes</button>
          <button class="ans" data-ans="kind">Kind of</button>
          <button class="ans" data-ans="no">No</button>
        </div>
      </div>
    </div>

    <!-- Phase 3: result -->
    <div class="phase" id="phaseResult">
      <div class="result">
        <div class="chart-box">
          <canvas id="chart"></canvas>
          <div class="legend">
            <span><span class="dot yours"></span>your prediction</span>
            <span><span class="dot typical"></span>most people</span>
          </div>
        </div>
        <p class="verdict" id="verdict"></p>
        <div class="actions">
          <button class="btn primary" id="saveBtn">Keep this prediction</button>
          <button class="btn ghost" id="againBtn">Start over</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <button class="close" id="modalClose" aria-label="Close">×</button>
    <h3 id="mTitle"></h3>
    <p class="date" id="mDate"></p>
    <p class="prior" id="mPrior"></p>
    <p class="predline" id="mPred"></p>
    <p class="q" id="mQ">And today — does it still matter?</p>
    <div class="answers">
      <button data-out="yes">Yes, still</button>
      <button data-out="kind">Kind of</button>
      <button data-out="no">Not anymore</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const page = document.querySelector('.page');
  const worryText = $('#worryText'), beginBtn = $('#beginBtn');
  const phaseCompose = $('#phaseCompose'), phasePredict = $('#phasePredict'), phaseResult = $('#phaseResult');
  const worryDisplay = $('#worryDisplay'), qBlock = $('#qBlock'), qText = $('#qText');
  const ansBtns = [...document.querySelectorAll('.ans')];
  const chartCanvas = $('#chart'), verdict = $('#verdict');
  const saveBtn = $('#saveBtn'), againBtn = $('#againBtn');
  const shelfList = $('#shelfList'), shelfStats = $('#shelfStats');
  const banner = $('#banner'), bannerText = $('#bannerText'), bannerGo = $('#bannerGo');
  const modal = $('#modal'), modalClose = $('#modalClose');
  const mTitle = $('#mTitle'), mDate = $('#mDate'), mPrior = $('#mPrior'), mPred = $('#mPred'), mQ = $('#mQ');
  const muteBtn = $('#mute');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ==================== audio ==================== */
  let AC = null, master = null, reverbIn = null, noiseBuffer = null;
  let muted = false;
  try { muted = localStorage.getItem('wtm:muted') === '1'; } catch(e){}

  function makeImpulse(c, dur, decay){
    const rate = c.sampleRate;
    const len = Math.max(1, Math.floor(rate * dur));
    const ir = c.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++){
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
    }
    return ir;
  }

  function ensureAudio(){
    if (!AC){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      try { AC = new Ctx(); } catch(e){ return false; }
      master = AC.createGain();
      master.gain.value = muted ? 0 : .55;
      master.connect(AC.destination);

      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 26; comp.ratio.value = 5;
      comp.attack.value = .004; comp.release.value = .3;
      comp.connect(master);

      const dry = AC.createGain(); dry.gain.value = 1; dry.connect(comp);
      const conv = AC.createConvolver();
      conv.buffer = makeImpulse(AC, 2.2, 1.8);
      const wet = AC.createGain(); wet.gain.value = .38;
      reverbIn = AC.createGain(); reverbIn.gain.value = 1;
      reverbIn.connect(conv); conv.connect(wet); wet.connect(comp);
      master._dry = dry;

      const nb = AC.createBuffer(1, Math.ceil(AC.sampleRate * 1.0), AC.sampleRate);
      const nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      noiseBuffer = nb;
    }
    if (AC.state !== 'running') AC.resume().catch(()=>{});
    return true;
  }
  function busIn(){ return master._dry; }

  const NOTE = f => f;
  // pentatonic just for warmth
  function playAnswer(horizonIdx, answer){
    if (!ensureAudio() || muted) return;
    const t = AC.currentTime;
    // base descends with horizon: E4 → D4 → C4 → A3
    const base = [329.63, 293.66, 261.63, 220.00][horizonIdx] || 261.63;
    // answer adds intervals: yes=0, kind=+4, no=+7
    const semi = answer === 'yes' ? 0 : answer === 'kind' ? 4 : 7;
    const f = base * Math.pow(2, semi / 12);
    const o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
    const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2.01;
    const g2 = AC.createGain(); g2.gain.value = .32;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.10, t + .015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(busIn());
    const send = AC.createGain(); send.gain.value = 1.2;
    g.connect(send); send.connect(reverbIn);
    o1.start(t); o1.stop(t + 1.8);
    o2.start(t); o2.stop(t + 1.8);
  }

  function playResolve(){
    if (!ensureAudio() || muted) return;
    const t = AC.currentTime;
    [392, 493.88, 587.33, 783.99].forEach((f, i) => {
      const start = t + i * .12;
      const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(.075, start + .03);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 2.0);
      o.connect(g); g.connect(busIn());
      const send = AC.createGain(); send.gain.value = 1.3;
      g.connect(send); send.connect(reverbIn);
      o.start(start); o.stop(start + 2.2);
    });
  }

  function playSave(){
    if (!ensureAudio() || muted) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 1046.5;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.06, t + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + .55);
    o.connect(g); g.connect(busIn());
    const send = AC.createGain(); send.gain.value = 1.0;
    g.connect(send); send.connect(reverbIn);
    o.start(t); o.stop(t + .7);
  }

  function playBell(){
    if (!ensureAudio() || muted) return;
    const t = AC.currentTime;
    [659.25, 987.77, 1318.5].forEach((f, i) => {
      const start = t + i * .15;
      const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(.07, start + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 1.8);
      o.connect(g); g.connect(busIn());
      const send = AC.createGain(); send.gain.value = 1.5;
      g.connect(send); send.connect(reverbIn);
      o.start(start); o.stop(start + 2.0);
    });
  }

  const paintMute = () => {
    muteBtn.classList.toggle('off', muted);
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  };
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('wtm:muted', muted ? '1' : '0'); } catch(e){}
    if (ensureAudio()) master.gain.setTargetAtTime(muted ? 0 : .55, AC.currentTime, .06);
    paintMute();
  });

  /* ==================== state ==================== */
  const KEY = 'wtm:v1';
  const HORIZONS = [
    { label: 'one week',    short: '1 wk', checkMs: 7 * 86400000,    typicalYes: 0.72 },
    { label: 'one month',   short: '1 mo', checkMs: 30 * 86400000,   typicalYes: 0.45 },
    { label: 'one year',    short: '1 yr', checkMs: 365 * 86400000,  typicalYes: 0.18 },
    { label: 'ten years',   short: '10 yr',checkMs: 10 * 365 * 86400000, typicalYes: 0.06 }
  ];
  const ANS_VAL = { yes: 1, kind: 0.5, no: 0 };

  let worries = [];   // { id, text, at, answers: [{hIdx, ans}], checkAt, checked, outcome }
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (Array.isArray(raw)) worries = raw.filter(w => w && typeof w.text === 'string' && Array.isArray(w.answers));
  } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(worries)); } catch(e){} };

  let current = null;  // { text, answers: [] }
  let qi = 0;          // which question index we're on (0..3)

  /* ==================== phase switching ==================== */
  function showPhase(name){
    phaseCompose.classList.toggle('show', name === 'compose');
    phasePredict.classList.toggle('show', name === 'predict');
    phaseResult.classList.toggle('show', name === 'result');
    page.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ==================== Q&A ==================== */
  function askQuestion(){
    if (qi >= HORIZONS.length){ showResult(); return; }
    const h = HORIZONS[qi];
    qText.textContent = `In ${h.label}, will this still matter to you?`;
    qBlock.classList.remove('on');
    void qBlock.offsetWidth;
    requestAnimationFrame(() => qBlock.classList.add('on'));
    // aging of the worry text
    const agingLevel = qi;  // 0,1,2,3
    applyAging(agingLevel);
    ansBtns.forEach(b => b.classList.remove('picked'));
  }
  function applyAging(level){
    const map = [
      { o: 1,    b: 0,   y: 0 },
      { o: 0.82, b: 0.5, y: 3 },
      { o: 0.55, b: 1.2, y: 7 },
      { o: 0.28, b: 2.6, y: 12 }
    ];
    const m = map[level] || map[3];
    worryDisplay.style.opacity = m.o;
    worryDisplay.style.filter = `blur(${m.b}px)`;
    worryDisplay.style.transform = `translateY(${m.y}px)`;
  }

  ansBtns.forEach(b => {
    b.addEventListener('click', () => {
      if (!current) return;
      const ans = b.dataset.ans;
      b.classList.add('picked');
      current.answers[qi] = ans;
      playAnswer(qi, ans);
      // brief pause to register the choice, then next question
      const delay = calm ? 80 : 380;
      setTimeout(() => {
        qi++;
        askQuestion();
      }, delay);
    });
  });

  function startPredictions(){
    const t = worryText.value.trim();
    if (!t) return;
    ensureAudio();
    current = { text: t, answers: [] };
    qi = 0;
    worryDisplay.textContent = t;
    worryDisplay.style.opacity = '1';
    worryDisplay.style.filter = 'none';
    worryDisplay.style.transform = 'translateY(0)';
    showPhase('predict');
    // give the phase a moment to render before the first question
    setTimeout(askQuestion, calm ? 30 : 250);
  }

  /* ==================== result ==================== */
  function showResult(){
    // final aging — the worry fully fades to a whisper
    worryDisplay.style.opacity = '0';
    worryDisplay.style.filter = 'blur(6px)';
    worryDisplay.style.transform = 'translateY(-18px)';
    // don't switch phases immediately; let the fade play
    const wait = calm ? 60 : 700;
    setTimeout(() => {
      showPhase('result');
      drawChart(current.answers);
      verdict.innerHTML = computeVerdict(current.answers);
      playResolve();
    }, wait);
  }

  function computeVerdict(answers){
    const vals = answers.map(a => ANS_VAL[a] || 0);
    const yours = (vals[0] + vals[1] + vals[2] + vals[3]) / 4;
    const typical = (0.72 + 0.45 + 0.18 + 0.06) / 4;
    const delta = yours - typical;
    if (delta > 0.28){
      return `You expect this to stick around longer than most people do. That's not unusual — but it's worth noticing that you're <b>predicting more lasting weight than the odds suggest</b>.`;
    }
    if (delta < -0.22){
      return `You think this will fade faster than most would. If you're right, you've got a good instinct for what matters. <b>Come back to it later and check.</b>`;
    }
    return `Your curve lands close to most people's. The odds say <b>even things that feel permanent now usually thin out</b>. We'll see.`;
  }

  /* ==================== chart ==================== */
 function drawChart(answers){
  // cancel any in-flight animation before starting a new one
  if (drawChart._handle){ cancelAnimationFrame(drawChart._handle); drawChart._handle = null; }

  const canvas = chartCanvas;
  const wrap = canvas.parentElement;

  // wait for layout — clientWidth can be 0 for one frame after a phase switch
  const w = wrap.clientWidth - 44;
  if (w < 60){
    drawChart._handle = requestAnimationFrame(() => drawChart(answers));
    return;
  }

  const h = 220;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const padL = 34, padR = 16, padT = 22, padB = 40;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  // static layer — grid, axis labels, typical curve
  function drawStatic(){
    ctx.clearRect(0, 0, w, h);

    // grid lines
    ctx.strokeStyle = 'rgba(180,220,200,.09)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++){
      const y = padT + (plotH * i / 4);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
    }

    // y-axis labels
    ctx.fillStyle = 'rgba(140,160,150,.55)';
    ctx.font = '10px -apple-system,"Iowan Old Style",Georgia,serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('will', padL - 8, padT + 4);
    ctx.fillText("won't", padL - 8, padT + plotH - 4);

    // x-axis horizon labels
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(140,160,150,.7)';
    HORIZONS.forEach((hz, i) => {
      const x = padL + plotW * (i / (HORIZONS.length - 1));
      ctx.fillText(hz.short, x, padT + plotH + 12);
    });

    // typical curve (dashed)
    ctx.strokeStyle = 'rgba(180,220,200,.32)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    HORIZONS.forEach((hz, i) => {
      const x = padL + plotW * (i / (HORIZONS.length - 1));
      const y = padT + plotH * (1 - hz.typicalYes);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // points on the user's curve — guard against a hole in answers
  const pts = answers.map((a, i) => {
    const v = (ANS_VAL[a] != null) ? ANS_VAL[a] : 0.5;
    return {
      x: padL + plotW * (i / (HORIZONS.length - 1)),
      y: padT + plotH * (1 - v)
    };
  });

  // total length of the polyline, for the reveal animation
  let totalLen = 0;
  for (let i = 1; i < pts.length; i++){
    totalLen += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  }

  const start = performance.now();
  const dur = calm ? 10 : 900;

  function step(){
    drawStatic();

    const t = Math.min(1, (performance.now() - start) / dur);
    const e = 1 - Math.pow(1 - t, 3);

    // user curve, animated via line dash
    ctx.strokeStyle = '#8ad0b0';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([totalLen, totalLen]);
    ctx.lineDashOffset = totalLen * (1 - e);
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    if (t >= 1){
      // point markers
      pts.forEach(p => {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12);
        g.addColorStop(0, 'rgba(160,240,200,.6)');
        g.addColorStop(1, 'rgba(160,240,200,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#c8f0dc';
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 6.28); ctx.fill();
        ctx.strokeStyle = 'rgba(140,220,190,.7)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 6.28); ctx.stroke();
      });
      drawChart._handle = null;
      return;
    }
    drawChart._handle = requestAnimationFrame(step);
  }

  step();
}

  /* ==================== save flow ==================== */
  saveBtn.addEventListener('click', () => {
    if (!current) return;
    // pick the earliest horizon where the user said 'yes' or 'kind'
    let checkIdx = HORIZONS.length - 1;
    for (let i = 0; i < current.answers.length; i++){
      if (current.answers[i] === 'yes' || current.answers[i] === 'kind'){
        checkIdx = i; break;
      }
    }
    const worry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      text: current.text,
      at: Date.now(),
      answers: current.answers.map((a, i) => ({ hIdx: i, ans: a })),
      checkAt: Date.now() + HORIZONS[checkIdx].checkMs,
      checkLabel: HORIZONS[checkIdx].label,
      checked: false,
      outcome: null
    };
    worries.unshift(worry);
    save();
    playSave();
    current = null;
    // return to compose
    worryText.value = '';
    beginBtn.disabled = true;
    worryDisplay.style.opacity = '1';
    worryDisplay.style.filter = 'none';
    worryDisplay.style.transform = 'translateY(0)';
    showPhase('compose');
    renderShelf();
  });

  againBtn.addEventListener('click', () => {
    current = null;
    worryText.value = '';
    beginBtn.disabled = true;
    worryDisplay.style.opacity = '1';
    worryDisplay.style.filter = 'none';
    worryDisplay.style.transform = 'translateY(0)';
    showPhase('compose');
  });

  /* ==================== shelf ==================== */
  function fmtShort(t){
    const d = new Date(t), n = new Date();
    return d.toLocaleDateString(undefined,
      d.getFullYear() === n.getFullYear()
        ? { month:'short', day:'numeric' }
        : { month:'short', day:'numeric', year:'numeric' });
  }

  function renderShelf(){
    shelfList.innerHTML = '';
    if (!worries.length){
      shelfList.innerHTML = '<p class="shelf-empty">Nothing predicted yet.<br>Write something above to start.</p>';
      shelfStats.textContent = '';
      return;
    }
    // calibration stats
    const resolved = worries.filter(w => w.checked && w.outcome != null);
    if (resolved.length){
      let correct = 0;
      resolved.forEach(w => {
        // what did they say about the horizon the check-in was for?
        const predAtCheck = w.answers.find(a => HORIZONS[a.hIdx].label === w.checkLabel);
        const predicted = predAtCheck ? predAtCheck.ans : 'kind';
        const actuallyMattered = w.outcome === 'yes' ? 1 : w.outcome === 'kind' ? .5 : 0;
        const predictedMattered = predicted === 'yes' ? 1 : predicted === 'kind' ? .5 : 0;
        if (Math.abs(actuallyMattered - predictedMattered) <= 0.5) correct++;
      });
      const pct = Math.round((correct / resolved.length) * 100);
      shelfStats.textContent = `${correct} of ${resolved.length} predictions held up · ${pct}%`;
    } else {
      shelfStats.textContent = `${worries.length} saved`;
    }

    worries.slice().sort((a,b) => a.at - b.at).reverse().forEach(w => {
      const due = !w.checked && Date.now() >= w.checkAt;
      const card = document.createElement('div');
      card.className = 'card' + (due ? ' due' : '') + (w.checked ? ' resolved' : '');
      // meta line
      let meta = `${fmtShort(w.at)} · check on ${w.checkLabel}`;
      if (w.checked && w.outcome){
        const word = w.outcome === 'yes' ? 'still mattered' : w.outcome === 'kind' ? 'partly' : 'didn\'t matter';
        meta = `${fmtShort(w.at)} · ${word}`;
      }
      card.innerHTML = `
        <p class="card-text">${escapeHtml(w.text)}</p>
        <p class="card-meta">
          <span>${meta}${due ? '<span class="card-badge">due</span>' : ''}</span>
        </p>`;
      card.addEventListener('click', () => {
        if (due) openModal(w);
        else viewOnly(w);
      });
      shelfList.appendChild(card);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  /* ==================== modal ==================== */
  let modalWorry = null;
  function openModal(w){
    modalWorry = w;
    mTitle.textContent = 'A worry from before';
    mDate.textContent = `You wrote this ${fmtShort(w.at)}`;
    mPrior.textContent = w.text;
    const predAtCheck = w.answers.find(a => HORIZONS[a.hIdx].label === w.checkLabel);
    const predWord = predAtCheck ? (predAtCheck.ans === 'yes' ? 'would still matter' : predAtCheck.ans === 'kind' ? 'would partly matter' : 'wouldn\'t matter') : 'would matter';
    mPred.innerHTML = `You predicted this <b>${predWord}</b> by ${w.checkLabel}.`;
    mQ.textContent = 'And today — does it still matter?';
    modal.querySelectorAll('.answers button').forEach(b => b.classList.remove('picked'));
    modal.classList.add('show');
  }

  function viewOnly(w){
    modalWorry = w;
    mTitle.textContent = w.checked ? 'Your prediction, resolved' : 'Your prediction';
    mDate.textContent = `You wrote this ${fmtShort(w.at)}`;
    mPrior.textContent = w.text;
    const predAtCheck = w.answers.find(a => HORIZONS[a.hIdx].label === w.checkLabel);
    const predWord = predAtCheck ? (predAtCheck.ans === 'yes' ? 'still matter' : predAtCheck.ans === 'kind' ? 'partly matter' : 'not matter') : 'matter';
    if (w.checked){
      const outWord = w.outcome === 'yes' ? 'it still mattered' : w.outcome === 'kind' ? 'it partly mattered' : 'it didn\'t matter';
      mPred.innerHTML = `You predicted this would <b>${predWord}</b> by ${w.checkLabel}. When we checked, <b>${outWord}</b>.`;
      mQ.textContent = '';
      modal.querySelector('.answers').style.display = 'none';
    } else {
      mPred.innerHTML = `You predicted this would <b>${predWord}</b> by ${w.checkLabel}.`;
      mQ.textContent = `Check back on ${new Date(w.checkAt).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}.`;
      modal.querySelector('.answers').style.display = 'none';
    }
    modal.classList.add('show');
  }

  modalClose.addEventListener('click', () => {
    modal.classList.remove('show');
    modal.querySelector('.answers').style.display = '';
    modalWorry = null;
  });
  modal.addEventListener('click', e => {
    if (e.target === modal){
      modal.classList.remove('show');
      modal.querySelector('.answers').style.display = '';
      modalWorry = null;
    }
  });
  modal.querySelectorAll('.answers button').forEach(b => {
    b.addEventListener('click', () => {
      if (!modalWorry) return;
      modalWorry.checked = true;
      modalWorry.outcome = b.dataset.out;
      modalWorry.checkedAt = Date.now();
      save();
      playSave();
      modal.classList.remove('show');
      modal.querySelector('.answers').style.display = '';
      modalWorry = null;
      renderShelf();
      checkForDue();
    });
  });

  /* ==================== banner for due worries ==================== */
  function checkForDue(){
    const due = worries.filter(w => !w.checked && Date.now() >= w.checkAt);
    if (due.length){
      banner.classList.add('show');
      bannerText.textContent = due.length === 1
        ? 'One prediction is ready to look at.'
        : `${due.length} predictions are ready to look at.`;
      bannerGo.onclick = () => {
        if (due[0]) openModal(due[0]);
      };
      if (banner.dataset.announced !== String(due.length)){
        banner.dataset.announced = String(due.length);
        playBell();
      }
    } else {
      banner.classList.remove('show');
      banner.dataset.announced = '';
    }
  }

  /* ==================== wiring ==================== */
  worryText.addEventListener('input', () => {
    beginBtn.disabled = !worryText.value.trim();
  });
  worryText.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) startPredictions();
  });
  beginBtn.addEventListener('click', startPredictions);

  addEventListener('resize', () => {
    if (phaseResult.classList.contains('show') && current && Array.isArray(current.answers)){
      drawChart(current.answers);
    }
  });

  /* ==================== boot ==================== */
  paintMute();
  renderShelf();
  checkForDue();
  // periodically check for newly due worries without a reload
  setInterval(checkForDue, 60000);
})();
</script>
</body>
</html>
