<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thought Decay</title>
<meta name="description" content="Type a stressor, watch it dissolve into particles, and grow a tree. A small browser ritual for letting go.">
<meta name="theme-color" content="#0f141d">
<meta property="og:title" content="Thought Decay">
<meta property="og:description" content="Type a stressor, watch it dissolve into particles, and grow a tree.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Thought Decay">
<meta name="twitter:description" content="Type a stressor, watch it dissolve into particles, and grow a tree.">
<style>
:root{--bg:#0f141d;--ink:#dbe4f0;--mute:#9aa7bc;--mint:127,224,184;--line:rgba(160,185,220,.14);
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(60% 45% at 50% -8%,rgba(70,110,170,.24),transparent 70%),
 radial-gradient(70% 40% at 50% 108%,rgba(60,160,130,.14),transparent 70%),var(--bg);
 color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.ui{position:relative;z-index:1;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;
 padding:clamp(24px,7vh,80px) 20px 0;text-align:center}
h1{margin:0;font-weight:300;font-size:clamp(30px,6vw,46px);letter-spacing:.12em;text-shadow:0 0 32px rgba(var(--mint),.25)}
.sub{margin:12px 0 0;color:var(--mute);font-size:clamp(15px,2.4vw,17px);font-style:italic;letter-spacing:.02em}
.slot{display:grid;width:min(560px,100%);margin-top:clamp(22px,4.5vh,40px)}
.slot>*{grid-area:1/1}
textarea{display:block;width:100%;box-sizing:border-box;height:clamp(120px,21vh,170px);padding:16px 18px;resize:none;
 background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;color:var(--ink);
 font:300 18px/1.6 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;outline:none;
 transition:border-color .4s,box-shadow .4s,background .4s}
textarea::placeholder{color:#7e8c9f}
textarea:focus{border-color:rgba(var(--mint),.45);background:rgba(255,255,255,.06);
 box-shadow:0 0 0 4px rgba(var(--mint),.07),0 0 44px rgba(var(--mint),.14)}
button{font:inherit;cursor:pointer;margin-top:18px;padding:12px 30px;border-radius:999px;color:#cdf5e6;letter-spacing:.08em;font-size:15px;
 border:1px solid rgba(var(--mint),.4);background:linear-gradient(rgba(var(--mint),.16),rgba(var(--mint),.05));
 transition:box-shadow .4s,opacity .4s,border-color .4s,transform .2s}
button:hover:not(:disabled){box-shadow:0 0 28px rgba(var(--mint),.28);border-color:rgba(var(--mint),.7)}
button:active:not(:disabled){transform:scale(.98)}
button:focus-visible{outline:2px solid rgba(var(--mint),.8);outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
.card{transition:opacity .9s ease,transform .9s ease;position:relative}
.card.gone{opacity:0;transform:translateY(14px);pointer-events:none}
.card.gone textarea{color:transparent;caret-color:transparent}
.card.gone .count{opacity:0}
.after{opacity:0;pointer-events:none;transition:opacity 1.2s ease;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.after.show{opacity:1;pointer-events:auto}
.status{margin:0;color:var(--mute);font-style:italic;font-size:16px;min-height:1.6em}
.after button{margin-top:16px;opacity:0;transition:opacity 1.4s ease .5s,box-shadow .4s}
.after.ready button{opacity:1}
.seeds{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.seed{margin:0;padding:7px 14px;font-size:13px;letter-spacing:.04em;color:var(--mute);background:rgba(255,255,255,.03);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px}
.seed i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);opacity:.6}
.seed[aria-checked=true]{color:var(--ink);border-color:rgba(var(--mint),.5);background:rgba(var(--mint),.08)}
.seed[aria-checked=true] i{opacity:1}
/* character counter — sits in the textarea's own top-right padding, fades in only once you type */
.count{position:absolute;top:10px;right:14px;font-size:11px;letter-spacing:.06em;color:#7e8c9f;
 font-style:normal;opacity:0;transition:opacity .35s ease,color .35s ease;pointer-events:none}
.count.on{opacity:.7}
.count.near{color:#e8b86a;opacity:.95}
/* back button — top-left, mirrors the mute button's footprint */
.back{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;margin:0;
 width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:999px;
 color:var(--mute);text-decoration:none;border:1px solid var(--line);
 background:rgba(255,255,255,.04);backdrop-filter:blur(6px);
 transition:color .3s,border-color .3s,background .3s}
.back:hover{color:var(--ink);border-color:rgba(var(--mint),.5);background:rgba(var(--mint),.08)}
.mute{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;margin:0;width:38px;height:38px;padding:0;display:grid;place-items:center;color:var(--mute);background:rgba(255,255,255,.04);border-color:var(--line)}
.mute .x{display:none}.mute.off .w{display:none}.mute.off .x{display:inline}
.forest{position:fixed;z-index:1;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);margin:0;font-size:12px;color:#7e8c9f;font-style:italic;pointer-events:none;max-width:calc(100% - 190px);text-align:left}
/* reset — subtle until hovered, mirrors the mute button's footprint but flat */
.reset{position:fixed;z-index:2;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);margin:0;padding:7px 14px;
 min-width:104px;text-align:center;font-size:12px;letter-spacing:.06em;color:#7e8c9f;background:rgba(255,255,255,.03);
 border:1px solid var(--line);border-radius:999px;transition:color .3s,border-color .3s,background .3s,box-shadow .3s}
.reset:hover:not(:disabled),.reset.armed{color:#ffb4b4;border-color:rgba(255,120,120,.5);background:rgba(255,120,120,.08);box-shadow:0 0 18px rgba(255,120,120,.15)}
.reset.armed{border-color:rgba(255,120,120,.75);background:rgba(255,120,120,.14)}
.reset:focus-visible{outline-color:rgba(255,140,140,.8)}
/* reset confirmation toast */
.toast{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);margin:0;padding:8px 18px;
 font-size:12px;letter-spacing:.06em;color:#cdf5e6;background:rgba(18,26,36,.94);border:1px solid rgba(var(--mint),.3);
 border-radius:999px;opacity:0;transform:translateX(-50%) translateY(8px);pointer-events:none;
 transition:opacity .5s ease,transform .5s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.card{transition:opacity .8s ease .35s,transform .8s ease .35s,filter .8s ease .35s}
.card.gone{transform:translateY(12px) scale(.985);filter:blur(3px);transition:opacity .7s ease,transform .7s ease,filter .7s ease}
.after{transition:opacity .45s ease}
.after.show{transition:opacity 1.1s ease .7s}
.breath{width:92px;height:92px;border-radius:50%;margin-top:2px;border:1px solid rgba(var(--mint),.55);
 background:radial-gradient(circle at 50% 40%,rgba(var(--mint),.28),rgba(var(--mint),.04) 70%);
 box-shadow:0 0 30px rgba(var(--mint),.2);will-change:transform}
.bl{margin:12px 0 10px;min-height:1.4em;font-size:15px;letter-spacing:.14em;color:#b9ead6}
.after .ghost{margin-top:8px;padding:6px 14px;font-size:13px;background:none;border-color:transparent;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<a class="back" href="index.html" aria-label="Back to the shelf"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></a>
<button id="mute" class="mute" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path class="w" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
<button id="reset" class="reset" aria-label="Reset forest">Reset forest</button>
<p class="forest" id="forest"></p>
<p class="toast" id="toast" role="status" aria-live="polite"></p>
<main class="ui">
  <h1>Thought Decay</h1>
  <p class="sub">Type your stressor, then let it dissolve.</p>
  <div class="slot">
    <section class="card" id="card">
      <textarea id="thought" maxlength="280" placeholder="What is weighing on you?" aria-label="Your stressor"></textarea>
      <span class="count" id="count" aria-hidden="true"></span>
      <div class="seeds" role="radiogroup" aria-label="Choose a seed">
        <button class="seed" type="button" role="radio" aria-checked="true"><i style="--c:#f7a6c3"></i>Sakura</button>
        <button class="seed" type="button" role="radio" aria-checked="false"><i style="--c:#6fb55a"></i>Ancient Oak</button>
        <button class="seed" type="button" role="radio" aria-checked="false"><i style="--c:#7ff5e0"></i>Crystal Fern</button>
      </div>
      <button id="release" disabled>Release &amp; Decay</button>
    </section>
    <div class="after" id="after" inert>
      <div class="breath" id="breath" aria-hidden="true"></div>
      <p class="bl" id="bl"></p>
      <p class="status" id="status" aria-live="polite"></p>
      <button id="again">Release Another Thought</button>
      <button id="shot" class="ghost">Save Forest Snapshot</button>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#c'); let ctx = cv.getContext('2d');
  const ta = $('#thought'), btn = $('#release'), card = $('#card'),
        after = $('#after'), status = $('#status'), again = $('#again'), flora = $('#forest'), muteB = $('#mute'),
        resetB = $('#reset'), seedB = [...document.querySelectorAll('.seed')], breath = $('#breath'), bl = $('#bl'),
        shotB = $('#shot'), cnt = $('#count'), toastEl = $('#toast');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

  /* ---------- canvas sizing ----------
     H tracks the *visual* viewport when available, so on mobile the ground line rises above the
     on-screen keyboard instead of hiding behind it. Small deltas are ignored to avoid thrashing
     the snapshot cache while the keyboard animates open or closed. */
  let W = 0, H = 0, dpr = 1, bx = 0, by = 0, L = 60, gen = 0, lastW = 0, lastH = 0;
  function resize(force) {
    const vv = window.visualViewport;
    const w = innerWidth, h = Math.round((vv && vv.height) || innerHeight);
    if (!force && Math.abs(w - lastW) < 4 && Math.abs(h - lastH) < 8) return;
    lastW = w; lastH = h; W = w; H = h;
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bx = W / 2; by = H - 46;
    L = Math.min(H * .1, W * .17, 90); gen++;          // trunk length
  }
  addEventListener('resize', () => resize(true));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => resize(false));
  resize(true);

  /* ---------- sprites, pre-rendered once on hidden canvases ---------- */
  const mkc = (w, h = w) => { const o = document.createElement('canvas'); o.width = w; o.height = h; return [o, o.getContext('2d')]; };
  const glow = (r, g, b) => {
    const [o, c] = mkc(64), q = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    q.addColorStop(0, `rgba(${r},${g},${b},1)`); q.addColorStop(.25, `rgba(${r},${g},${b},.55)`); q.addColorStop(1, `rgba(${r},${g},${b},0)`);
    c.fillStyle = q; c.fillRect(0, 0, 64, 64); return o;
  };
  const GL = { warm: glow(255, 225, 150), cyan: glow(140, 255, 235) };
  const leafPath = (c, l, w) => { c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(w, -l * .3, w * .8, -l * .8, 0, -l); c.bezierCurveTo(-w * .8, -l * .8, -w, -l * .3, 0, 0); c.closePath(); };
  const shardPath = (c, l, w) => { c.beginPath(); c.moveTo(0, 0); c.lineTo(w, -l * .35); c.lineTo(0, -l); c.lineTo(-w, -l * .35); c.closePath(); };
  function foliage(dark, light, crystal) {            // layered fan of five leaves or shards
    const [o, c] = mkc(64); c.translate(32, 58);
    [-.95, .95, -.5, .5, 0].forEach((a, i) => {
      c.save(); c.rotate(a); const l = 42 - (i % 2) * 5, g = c.createLinearGradient(0, 0, 0, -l);
      g.addColorStop(0, dark); g.addColorStop(1, light); c.fillStyle = g; c.globalAlpha = .93;
      (crystal ? shardPath : leafPath)(c, l, crystal ? 7 : 11); c.fill();
      c.strokeStyle = crystal ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.22)'; c.lineWidth = .8; c.stroke();
      if (!crystal) { c.beginPath(); c.moveTo(0, -2); c.lineTo(0, -l * .8); c.stroke(); }
      c.restore();
    });
    return o;
  }
  function sakura() {                                  // two layers of five notched petals, stamens, heart
    const [o, c] = mkc(96); c.translate(48, 48);
    for (let y = 0; y < 2; y++) for (let i = 0; i < 5; i++) {
      const z = y ? 15 : 22; c.save(); c.rotate((y ? Math.PI / 5 : 0) + i * Math.PI * 2 / 5);
      const g = c.createRadialGradient(0, -z * .3, 1, 0, -z * .7, z * 1.2);
      g.addColorStop(0, y ? '#fff4f8' : '#ffdfeb'); g.addColorStop(.7, y ? '#ffc6da' : '#f7a6c3'); g.addColorStop(1, '#e97ea3');
      c.fillStyle = g; c.beginPath(); c.moveTo(0, 0);
      c.bezierCurveTo(-z * .95, -z * .3, -z * .8, -z * 1.2, -z * .18, -z * 1.05); c.lineTo(0, -z * .86); c.lineTo(z * .18, -z * 1.05);
      c.bezierCurveTo(z * .8, -z * 1.2, z * .95, -z * .3, 0, 0); c.fill();
      c.strokeStyle = 'rgba(190,70,110,.35)'; c.lineWidth = .7; c.stroke(); c.restore();
    }
    c.strokeStyle = '#e0678f'; c.fillStyle = '#ffe08a'; c.lineWidth = .8;
    for (let i = 0; i < 8; i++) { const x = Math.cos(i * .785) * 8, y = Math.sin(i * .785) * 8;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(x, y); c.stroke(); c.beginPath(); c.arc(x, y, 1.4, 0, 6.3); c.fill(); }
    c.fillStyle = '#d9507f'; c.beginPath(); c.arc(0, 0, 2.2, 0, 6.3); c.fill(); return o;
  }
  function crystalBloom() {                            // faceted star with a soft halo
    const [o, c] = mkc(96); c.translate(48, 48);
    const h = c.createRadialGradient(0, 0, 0, 0, 0, 46); h.addColorStop(0, 'rgba(150,255,240,.55)'); h.addColorStop(1, 'rgba(150,255,240,0)');
    c.fillStyle = h; c.fillRect(-48, -48, 96, 96);
    for (let i = 0; i < 8; i++) {
      c.save(); c.rotate(i * Math.PI / 4); const l = i % 2 ? 24 : 38, g = c.createLinearGradient(0, 0, 0, -l);
      g.addColorStop(0, '#6ff5e0'); g.addColorStop(1, '#ffffff'); c.fillStyle = g; shardPath(c, l, 6); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = .7; c.stroke(); c.restore();
    }
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 3, 0, 6.3); c.fill(); return o;
  }
  function oakBloom() {                                // fresh pale-gold growth with catkin buds
    const [o, c] = mkc(96); c.translate(48, 48);
    for (let i = 0; i < 6; i++) {
      c.save(); c.rotate(i * Math.PI / 3); const g = c.createLinearGradient(0, 0, 0, -34);
      g.addColorStop(0, '#6fb55a'); g.addColorStop(1, '#d9f08a'); c.fillStyle = g; leafPath(c, 34, 10); c.fill(); c.restore();
    }
    c.fillStyle = '#f3d36b';
    for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(Math.cos(i * 1.26) * 6, Math.sin(i * 1.26) * 6, 2.4, 0, 6.3); c.fill(); }
    return o;
  }
  function petalSprite(kind) {
    const [o, c] = mkc(32); c.translate(16, 28);
    if (kind === 0) { c.fillStyle = '#ffc6da'; c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-14, -6, -12, -24, -2, -24); c.lineTo(0, -21); c.lineTo(2, -24); c.bezierCurveTo(12, -24, 14, -6, 0, 0); c.fill(); }
    else if (kind === 1) { c.fillStyle = '#9ccf63'; leafPath(c, 26, 8); c.fill(); }
    else { c.fillStyle = '#9cfbee'; shardPath(c, 26, 6); c.fill(); }
    return o;
  }
  const SPECIES = [
    { w: 1, spread: [.3, .52], bend: .35, third: .25, ratio: [.7, .84], dense: false, lm: .8, fly: 'warm', aura: [255, 170, 205],
      bark: d => `hsl(${20 + d * 2} 24% ${31 + d * 2.6}%)`, leaf: [foliage('#3f7a52', '#a5dba0'), foliage('#4e8f5d', '#c4efae')], bloom: sakura(), petal: petalSprite(0) },
    { w: 1.5, spread: [.35, .6], bend: .45, third: .45, ratio: [.72, .86], dense: true, lm: 1.15, fly: 'warm', aura: [150, 235, 160],
      bark: d => `hsl(${30 + d * 3} 30% ${27 + d * 2.4}%)`, leaf: [foliage('#1f5a36', '#6fc070'), foliage('#2c6f3c', '#9be07c')], bloom: oakBloom(), petal: petalSprite(1) },
    { w: .75, spread: [.5, .5], bend: 0, third: 0, ratio: [.74, .74], dense: false, lm: .85, fly: 'cyan', aura: [120, 255, 235],
      bark: d => `hsl(${175 + d * 2} 80% ${52 + d * 2.5}%)`, leaf: [foliage('#0e7f9a', '#8ffff0', 1), foliage('#18a6b5', '#d5fffa', 1)], bloom: crystalBloom(), petal: petalSprite(2) }
  ];

  /* ---------- procedural trees (seeded per species + seed id) ---------- */
  const MAXD = 8, GMAX = 10;
  const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const trees = new Map();
  function treeOf(s, k) {
    const key = s + ':' + k; if (trees.has(key)) return trees.get(key);
    const P = SPECIES[s], R = rng(k * 7 + s * 131 + 5), rg = ([a, b]) => a + R() * (b - a);
    const mk = (d, a) => {
      const n = { d, a, l: rg(P.ratio), bend: (R() - .5) * P.bend * .5, ph: R() * 6.28, k: [], ls: .7 + R() * .6, bloom: d === MAXD && R() < .45 };
      if (d < MAXD) {
        if (d === 0) n.k.push(mk(1, (R() - .5) * .12));
        else {
          const sp = rg(P.spread), j = () => P.bend ? .6 + R() * .6 : 1;
          n.k.push(mk(d + 1, -sp * j()), mk(d + 1, sp * j()));
          if (d >= 2 && d < 6 && R() < P.third) n.k.push(mk(d + 1, (R() - .5) * .3));
        }
      }
      return n;
    };
    const t = mk(0, 0); trees.set(key, t); return t;
  }

  /* ---------- tree rasteriser ----------
     Each branch is a tapered ribbon whose centreline is sampled from the branch's quadratic curve.
     The linear gradient runs along the true chord (base → tip), and a solid rounded tip filled with
     the exact end colour closes the limb.

     Two passes keep the joints clean:
       pass 0  — every limb's drop shadow, drawn first, so a branch's shadow can never land on the
                 bark of its own parent (that was the dark smear along the crotch of each fork).
       pass 1  — all bark, on top of every shadow.
     Junction rings are tinted from the local bark hue rather than near-black, so the fork reads as
     the same wood instead of a dark stroke. */
  function drawTree(c, s, k, Gv, ox, oy, t, sw, out, bs) {
    const P = SPECIES[s], u = L / 80, lf = [], bm = [], wd = d => Math.max(.7, L * .13 * P.w * Math.pow(.72, d));
    /* One continuous bark ramp for the whole tree: bc[d][1] (a limb's tip tone) is literally the same
       string as bc[d+1][0] (its children's base tone), so no seam can ever appear at a joint. */
    const barkCol = (x, al, lum = 0) => {
      const m = P.bark(x).match(/[\d.]+/g).map(Number), r = clamp(x / (MAXD + 1));
      return `hsl(${m[0]} ${Math.min(100, m[1] + 30 * r)}% ${clamp(m[2] + 20 * r + lum, 0, 100)}% / ${al})`;
    };
    const bc = P.bc || (P.bc = Array.from({ length: MAXD + 1 }, (_, d) => [barkCol(d, 1), barkCol(d + 1, 1)]));

    const walk = (n, x, y, ang, pl, pass) => {
      const f = clamp(Gv - n.d * .85); if (f <= 0) return;
      const e = f * f * (3 - 2 * f), len = n.d ? pl * n.l : L, dl = Math.atan(2 * n.bend);

      if (phase !== 'idle' || i === sel) return;
      settle(sel);                         // saves the outgoing tree (retired only if it is in full bloom)
      sel = i; G = Gt = plants[i].g;       // load the incoming tree BEFORE any further sync, so its growth is never overwritten
      settle(i); save();
    }
    // Roving tabindex: only the checked radio is a tab stop, so Tab flows textarea → seed group → Release.
    seedB.forEach((b, j) => {
      const on = j === i;
      b.setAttribute('aria-checked', on);
      b.tabIndex = on ? 0 : -1;
    });
    syncFlora();
  }

  /* ---------- small UI helpers: character counter + toast ---------- */
  function updCount() {
    const n = ta.value.length, lim = ta.maxLength || 280;
    cnt.textContent = n ? `${n} / ${lim}` : '';
    cnt.classList.toggle('on', n > 0);
    cnt.classList.toggle('near', n > lim * .85);
  }
  let toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  /* ---------- the scene (everything except text particles), reused for the PNG export ---------- */
  function scene(ts, dt, live) {
    const S = SPECIES[sel], rgb = S.aura.join(',');
    ctx.globalCompositeOperation = 'lighter';           // aura, dust and fireflies
    const ar2 = Math.max(W, H) * .36, ay = by - L * 1.6, ag = ctx.createRadialGradient(bx, ay, 0, bx, ay, ar2);
    ag.addColorStop(0, `rgba(${rgb},${auraV})`); ag.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = ag; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(200,215,240)';
    /* Reduced-motion: dust and fireflies hold still (fixed position, fixed brightness) instead of
       drifting and twinkling. The scene still reads as alive, without the ambient motion. */
    if (calm) {
      ctx.globalAlpha = .16;
      for (const d of dust) ctx.fillRect(d.u * W, d.v * H, d.r, d.r);
      const fg = GL[S.fly]; ctx.globalAlpha = .5;
      for (const f of flies) ctx.drawImage(fg, f.u * W - f.z, f.v * H - f.z, f.z * 2, f.z * 2);
    } else {
      for (const d of dust) {
        ctx.globalAlpha = .1 + .12 * (.5 + .5 * Math.sin(ts * .001 * d.s + d.ph));
        ctx.fillRect(((d.u * W + Math.sin(ts * .00021 * d.s + d.ph) * 50) % W + W) % W, d.v * H + Math.cos(ts * .00027 * d.s + d.ph) * 34, d.r, d.r);
      }
      const fg = GL[S.fly];
      for (const f of flies) {
        const x = f.u * W + Math.sin(ts * .00023 * f.s + f.ph) * 70 + Math.sin(ts * .0009 + f.ph) * 12, y = f.v * H + Math.cos(ts * .00031 * f.s + f.ph * 2) * 42;
        const tw = Math.max(0, Math.sin(ts * .0016 * f.s + f.ph)); ctx.globalAlpha = .12 + .75 * tw * tw;
        ctx.drawImage(fg, x - f.z, y - f.z, f.z * 2, f.z * 2);
      }
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    drawGround(ts);

    const n0 = Math.max(0, forest.length - 10);          // retired trees keep fixed slots, so nothing shifts or flickers
    for (let j = n0; j < forest.length; j++) {
      const f = forest[j], sl = j % 10, st = sl >> 1, x = bx + (sl % 2 ? 1 : -1) * (L * 2.7 + st * L * 1.7);
      if (x < 24 || x > W - 24) continue;
      if (f.gen !== gen || !f.img) snap(f);
      const sc = .62 - st * .03; ctx.globalAlpha = .78;
      ctx.drawImage(f.img, x - f.cw * sc / 2, by - 3 - (st % 2) * 4 - (f.ch - 6) * sc, f.cw * sc, f.ch * sc);
    }
    ctx.globalAlpha = 1;

    const bm = []; if (G > .001) drawTree(ctx, sel, plants[sel].k, G, bx, by, ts, !calm && live ? windAmp : 0, bm, dpr);
    if (live && bm.length && ts > nextPetal && petals.length < (calm ? 8 : 34)) {   // petals break away from mature blooms
      const j = ((Math.random() * bm.length / 2) | 0) * 2;
      petals.push({ x: bm[j], y: bm[j + 1], vy: .25 + Math.random() * .3, ph: Math.random() * 6.28, r: Math.random() * 6.28, vr: (Math.random() - .5) * .05, z: 6 + Math.random() * 4, a: 1 });
      nextPetal = ts + (700 + Math.random() * 1500) / clamp((G - 7.6) / 1.5, .2, 1);
    }
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i]; p.x += (Math.sin(ts * .0015 + p.ph) * .6 + .15) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.y >= by) { p.y = by; p.vy = 0; p.vr = 0; p.a -= .012 * dt; if (p.a <= 0) { petals.splice(i, 1); continue; } }
      ctx.save(); ctx.globalAlpha = p.a * .9; ctx.translate(p.x, p.y); ctx.rotate(p.r + Math.sin(ts * .002 + p.ph) * .5);
      ctx.drawImage(S.petal, -p.z, -p.z, p.z * 2, p.z * 2); ctx.restore();
    }
  }

  /* ---------- main loop ---------- */
  let last = performance.now(), lastLab = '', windAmp = 1, wb = 0;
  const ease = x => x * x * (3 - 2 * x);
  function frame(ts) {
    const dt = Math.min(3, (ts - last) / 16.667 || 1); last = ts;
    G += (Gt - G) * (1 - Math.pow(.97, dt)); pulse *= Math.pow(.96, dt); tickHum(dt);
    wb += ((after.classList.contains('show') ? 1 : 0) - wb) * .02 * dt;      // wind picks up while thoughts are absorbed and while you breathe
    windAmp = 1 + 1.2 * ar + .5 * wb;
    auraV += (.05 + .13 * clamp(G / GMAX) + .018 * Math.min(8, forest.length) + pulse * .25 - auraV) * (1 - Math.pow(.998, dt));  // slow brightening
    ctx.clearRect(0, 0, W, H);
    scene(ts, dt, true);

    if (particles.length) {
      update(dt);
      for (const p of particles) {
        ctx.globalAlpha = p.go ? p.a : .92;
        ctx.fillStyle = pal[p.go ? Math.min(7, p.age * 2.4 | 0) : 0];
        ctx.fillRect(p.x, p.y, p.s, p.s);
      }
      ctx.globalAlpha = 1;
    }

    if (after.classList.contains('show')) {              // 4-7-8 breathing guide: in 4, hold 7, out 8
      const t = ((ts - t0) / 1000) % 19; let sc, lab;
      if (t < 4) { sc = .55 + .45 * ease(t / 4); lab = 'Inhale ' + Math.ceil(4 - t); }
      else if (t < 11) { sc = 1; lab = 'Hold ' + Math.ceil(11 - t); }
      else { sc = 1 - .45 * ease((t - 11) / 8); lab = 'Exhale ' + Math.ceil(19 - t); }
      /* Reduced-motion: the circle stays at its resting size and only the text cue advances, so the
         4-7-8 guidance still works without a large pulsing shape. */
      if (!calm) {
        breath.style.transform = `scale(${sc.toFixed(3)})`;
        breath.style.boxShadow = `0 0 ${(18 + sc * 36) | 0}px rgba(127,224,184,${(.12 + sc * .25).toFixed(2)})`;
      }
      if (lab !== lastLab) bl.textContent = lastLab = lab;
    }

    if (phase === 'releasing' && !particles.length && Gt - G < .02 && performance.now() - t0 > 600) {
      phase = 'done'; stopHum(); save(); syncFlora();
      status.textContent = Gt >= GMAX - .02 ? 'Full bloom. This tree joins your forest when you plant the next seed.' : 'Released. Something small is growing.';
      after.classList.add('ready');
    }
    requestAnimationFrame(frame);
  }

  /* ---------- PNG export: scene only, no UI text, re-rendered at high resolution ---------- */
  async function shot() {
    const es = Math.min(3, 4096 / Math.max(W, H)), od = dpr, oc = ctx, [xo, xc] = mkc(Math.round(W * es), Math.round(H * es));
    const glowBg = (cx, cy, rx, ry, col) => { xc.save(); xc.translate(cx, cy); xc.scale(rx, ry); const g = xc.createRadialGradient(0, 0, 0, 0, 0, 1);
      g.addColorStop(0, col); g.addColorStop(.7, 'rgba(0,0,0,0)'); xc.fillStyle = g; xc.fillRect(-1, -1, 2, 2); xc.restore(); };
    xc.setTransform(es, 0, 0, es, 0, 0); xc.fillStyle = '#0f141d'; xc.fillRect(0, 0, W, H);
    glowBg(W / 2, -.08 * H, W * .6, H * .45, 'rgba(70,110,170,.24)'); glowBg(W / 2, 1.08 * H, W * .7, H * .4, 'rgba(60,160,130,.14)');
    dpr = es; ctx = xc;
    try { scene(performance.now(), 0, false); } finally { ctx = oc; dpr = od; }
    xo.toBlob(async b => {
      if (!b) return;
      let dl = null; try { dl = window.claude && await window.claude.use('downloads'); } catch (e) {}
      if (dl) { try { await dl.save({ filename: 'thought-decay-forest.png', data: b }); } catch (e) {} }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'thought-decay-forest.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
    }, 'image/png');
  }

  /* ---------- UI wiring ---------- */
  ta.addEventListener('input', () => { btn.disabled = !ta.value.trim(); updCount(); });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) release(); });
  btn.addEventListener('click', release);
  seedB.forEach((b, i) => {
    b.addEventListener('click', () => pick(i));
    b.addEventListener('keydown', e => {                 // arrow-key navigation for the radiogroup
      let ni = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') ni = (i + 1) % seedB.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ni = (i - 1 + seedB.length) % seedB.length;
      if (ni >= 0) { e.preventDefault(); pick(ni); seedB[ni].focus(); }
    });
  });
  shotB.addEventListener('click', shot);
  again.addEventListener('click', () => {
    if (phase !== 'done') return;
    phase = 'idle'; settle(sel); syncFlora(); save();
    ta.value = ''; ta.disabled = false; btn.disabled = true; newPrompt(); updCount();
    after.classList.remove('show', 'ready'); after.inert = true;
    card.classList.remove('gone');
    card.inert = false;                                  // restore the card to the tab order
    lastLab = '';                                        // so the first breathing cue of the next round always paints
    ta.focus({ preventScroll: true });
  });

  /* ---------- two-step reset: no native confirm(), reversible by doing nothing ---------- */
  let resetT = 0;
  const disarmReset = () => { clearTimeout(resetT); resetB.classList.remove('armed'); resetB.textContent = 'Reset forest'; resetB.setAttribute('aria-label', 'Reset forest'); };
  resetB.addEventListener('click', () => {
    if (!resetB.classList.contains('armed')) {           // first press arms, second confirms
      resetB.classList.add('armed'); resetB.textContent = 'Really reset?';
      resetB.setAttribute('aria-label', 'Confirm reset — erases your whole forest');
      clearTimeout(resetT); resetT = setTimeout(disarmReset, 3500);
      return;
    }
    disarmReset();
    doReset();
  });
  function doReset() {
    if (phase === 'releasing') stopHum();                // tear down anything in flight
    particles.length = 0; petals.length = 0;
    phase = 'idle'; perP = 0;
    /* Fresh state: three new seed keys, no retired trees, no count. */
    plants = [0, 1, 2].map(() => ({ k: newK(), g: 0 }));
    forest = []; count = 0; sel = 0;
    G = Gt = 0; pulse = 0; auraV = 0;
    trees.clear();                                       // drop cached branch geometry for the old keys
    try { localStorage.removeItem(KEY); localStorage.removeItem('thought-decay:forest:v1'); } catch (e) {}
    /* Put the interface back into its opening state. */
    ta.value = ''; ta.disabled = false; btn.disabled = true; newPrompt(); updCount();
    card.classList.remove('gone'); card.inert = false;
    after.classList.remove('show', 'ready'); after.inert = true;
    lastLab = '';
    pick(0, true);                                       // re-check Sakura and refresh the radio tabindex
    syncFlora(); save();                                 // persist the empty forest
    toast('Forest cleared');
  }

  const paintMute = () => { muteB.classList.toggle('off', muted); muteB.setAttribute('aria-pressed', muted); muteB.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound'); };
  muteB.addEventListener('click', () => {
    muted = !muted; try { localStorage.setItem(MKEY, muted ? '1' : '0'); } catch (e) {}
    if (ensureAudio()) master.gain.setTargetAtTime(muted ? 0 : .7, AC.currentTime, .05);
    paintMute();
  });
  addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  newPrompt(); pick(sel, true); paintMute(); updCount();
  /* A returning visitor's half-grown tree is explained in the caption, so give it a gentle entrance
     rather than letting it sit there unannounced on first paint. */
  if (restored) { flora.style.opacity = '0'; requestAnimationFrame(() => { flora.style.transition = 'opacity 1.4s ease .6s'; flora.style.opacity = '1'; }); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
